<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OneShots · Publish</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="stripe" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <header class="top">
      <a href="/" class="brand"
        ><img src="/favicon.svg" alt="" />OneShots <span>Publish</span></a
      >
      <a
        class="site"
        href="https://ka2le.github.io/oneshot-testers/"
        target="_blank"
        rel="noopener"
        >Site ↗</a
      >
    </header>
    <main>
      <section class="sheet site-publish" aria-label="Publish current site">
        <div>
          <h1>Site changes</h1>
          <p>Publish the current design, features and existing games.</p>
        </div>
        <button id="publish-site" class="publish" type="button" disabled>
          Publish site changes
        </button>
        <p class="publish-note">
          Builds, commits, pushes and updates the live site. No upload needed.
        </p>
      </section>
      <form id="upload-form" class="sheet">
        <h2 class="section-title">Add a game</h2>
        <fieldset id="fields">
          <label class="field"
            >Game
            <input
              id="game"
              required
              maxlength="120"
              list="game-list"
              placeholder="Snake"
              autocomplete="off"
            />
            <datalist id="game-list"></datalist>
          </label>
          <div class="trio">
            <label class="field"
              >Model
              <input
                id="model"
                required
                maxlength="60"
                list="model-list"
                placeholder="Qwen"
                autocomplete="off"
              />
              <datalist id="model-list"></datalist>
            </label>
            <label class="field"
              >Version
              <input
                id="version"
                maxlength="60"
                list="version-list"
                placeholder="3.6-35B-A3B"
                autocomplete="off"
              />
              <datalist id="version-list"></datalist>
            </label>
            <label class="field"
              >Quant
              <input
                id="quant"
                maxlength="60"
                list="quant-list"
                placeholder="Q4_K_M"
                autocomplete="off"
              />
              <datalist id="quant-list"></datalist>
            </label>
          </div>

          <div id="drop-zone" class="drop">
            <span>Drop files, a folder or a ZIP</span>
            <div class="pick">
              <label class="pill"
                >Files<input id="files" type="file" multiple
              /></label>
              <label class="pill"
                >Folder<input id="folder" type="file" webkitdirectory multiple
              /></label>
            </div>
          </div>

          <div id="staged" class="staged" hidden>
            <span id="file-summary"></span>
            <select id="entry" aria-label="Page to open"></select>
            <button
              id="remove"
              type="button"
              class="x"
              aria-label="Remove files"
            >
              ×
            </button>
          </div>

          <p id="notice" role="status" aria-live="polite"></p>
          <button id="deploy" class="publish" type="submit" disabled>
            Publish game
          </button>
        </fieldset>
      </form>

      <section id="job-panel" class="sheet job" hidden aria-label="Publishing">
        <div class="job-head">
          <h2 id="job-state">Publishing…</h2>
          <a id="live-link" hidden target="_blank" rel="noopener">Open ↗</a>
        </div>
        <p id="job-error" class="error" hidden></p>
        <details id="log-box">
          <summary>Log</summary>
          <pre id="log" tabindex="0"></pre>
        </details>
        <button id="retry" type="button" class="pill" hidden>Retry</button>
      </section>
    </main>
  </body>
</html>
