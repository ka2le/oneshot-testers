<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Desert Snake - WASD</title>
<style>
  :root{
    --sand:#e8c48c;
    --sand-dark:#d2a86e;
    --sand-light:#f5e1c1;
    --cactus:#3fa34d;
    --snake-head:#2e7d32;
    --snake-body:#66a84a;
    --food:#d64545;
    --gold:#f5c542;
    --text:#3b2f1a;
  }
  html,body{
    height:100%;
    margin:0;
    background:#b68b4d;
    font-family: system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
  }
  .game-wrap{
    background:linear-gradient(#f5e1c1,#e8c48c 60%,#d2a86e);
    padding:24px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.35), inset 0 0 0 8px #c9a66a;
    text-align:center;
  }
  h1{
    margin:0 0 10px;
    font-size:28px;
    letter-spacing:1px;
    text-shadow:2px 2px 0 #fff8;
  }
  #hud{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    margin-bottom:10px;
    font-size:18px;
  }
  canvas{
    background:#e8c48c;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 18px, rgba(0,0,0,.04) 19px),
      repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(0,0,0,.04) 19px);
    border-radius:12px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.15);
    display:block;
  }
  .controls{
    margin-top:12px;
    font-size:14px;
    opacity:.85;
  }
  button{
    margin-top:10px;
    padding:10px 18px;
    font-size:16px;
    font-weight:700;
    border:none;
    border-radius:10px;
    background:#3b2f1a;
    color:#f5e1c1;
    cursor:pointer;
    box-shadow:0 4px 0 #1a140a;
    transition:.05s;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #1a140a;}
  .overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 10px, transparent 10px 20px);
    opacity:0;
    transition:.3s;
  }
  .sandstorm .overlay{ opacity:.35; }
</style>
</head>
<body>
<div class="game-wrap">
  <h1>🌵 Desert Snake 🌵</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <div style="position:relative; display:inline-block">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="controls">W A S D to move • P to pause • R to restart</div>
  <button id="restart">Restart</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const restartBtn = document.getElementById('restart');
  const overlay = document.getElementById('overlay');
  const wrap = document.querySelector('.game-wrap');

  const GRID = 30;
  const TILE = canvas.width / GRID;
  let best = +localStorage.getItem('desertSnakeBest') || 0;
  bestEl.textContent = best;

  let snake, dir, nextDir, food, bonus, cacti, score, speed, lastTime, paused, gameOver, sandstorm;

  function reset(){
    snake = [{x:15,y:15}];
    dir = {x:1,y:0};
    nextDir = {...dir};
    score = 0;
    speed = 120;
    sandstorm = {active:false, timer:0};
    paused = false;
    gameOver = false;
    cacti = [];
    for(let i=0;i<12;i++){
      let p;
      do{p={x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)}}
      while(p.x<5||p.y<5);
      cacti.push(p);
    }
    spawnFood();
    spawnBonus();
  }

  function spawnFood(){
    let p;
    do{
      p={x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)};
    }while(snake.some(s=>s.x===p.x&&s.y===p.y) || cacti.some(c=>c.x===p.x&&c.y===p.y));
    food = p;
  }

  function spawnBonus(){
    if(Math.random()<0.3){
      let p;
      do{
        p={x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)};
      }while(snake.some(s=>s.x===p.x&&s.y===p.y) || cacti.some(c=>c.x===p.x&&c.y===p.y) || (food && food.x===p.x && food.y===p.y));
      bonus = {x:p.x, y:p.y, type: Math.random()<0.5?'gold':'water', ttl:200};
    } else bonus = null;
  }

  function drawTile(x,y,color,r=4){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x*TILE+2, y*TILE+2, TILE-4, TILE-4, r);
    ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // dunes
    ctx.fillStyle = '#e8c48c';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // cacti
    cacti.forEach(c=>{
      ctx.fillStyle = '#3fa34d';
      ctx.fillRect(c.x*TILE+8, c.y*TILE+6, TILE-16, TILE-12);
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(c.x*TILE+10, c.y*TILE+4, 4, 6);
      ctx.fillRect(c.x*TILE+18, c.y*TILE+4, 4, 6);
    });

    // food
    drawTile(food.x, food.y, '#d64545', 6);

    // bonus
    if(bonus){
      ctx.fillStyle = bonus.type==='gold'?'#f5c542':'#4aa3df';
      ctx.beginPath();
      ctx.arc((bonus.x+0.5)*TILE, (bonus.y+0.5)*TILE, TILE*0.35, 0, Math.PI*2);
      ctx.fill();
    }

    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#2e7d32' : '#66a84a';
      drawTile(s.x,s.y,ctx.fillStyle,5);
      if(i===0){
        // eyes
        ctx.fillStyle='#fff';
        let ex = dir.x!==0 ? (dir.x>0?1:-1) : 0;
        let ey = dir.y!==0 ? (dir.y>0?1:-1) : 0;
        ctx.fillRect((s.x+0.3+ex*0.1)*TILE, (s.y+0.3+ey*0.1)*TILE, 4,4);
        ctx.fillRect((s.x+0.6-ex*0.1)*TILE, (s.y+0.3+ey*0.1)*TILE, 4,4);
      }
    });

    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff';
      ctx.font='36px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
      ctx.font='20px sans-serif';
      ctx.fillText('Press R to restart', canvas.width/2, canvas.height/2 + 30);
    }
    if(paused && !gameOver){
      ctx.fillStyle='rgba(0,0,0,.4)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff';
      ctx.font='32px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Paused', canvas.width/2, canvas.height/2);
    }
  }

  function step(){
    if(paused || gameOver) return;
    dir = {...nextDir};

    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall collision
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID){ return endGame(); }

    // self / cactus
    if(snake.some(s=>s.x===head.x&&s.y===head.y) || cacti.some(c=>c.x===head.x&&c.y===head.y)){ return endGame(); }

    snake.unshift(head);

    // eat food
    if(head.x===food.x && head.y===food.y){
      score += 10;
      if(speed>70) speed -= 2;
      spawnFood();
      spawnBonus();
    } else {
      snake.pop();
    }

    // bonus
    if(bonus && head.x===bonus.x && head.y===bonus.y){
      if(bonus.type==='gold'){
        score += 50;
        speed = Math.max(60, speed-20);
        setTimeout(()=>speed = Math.min(150, speed+20),3000);
      }else{
        speed = Math.min(200, speed+40);
        setTimeout(()=>speed = Math.max(80, speed-40),4000);
      }
      bonus = null;
    }

    // sandstorm twist
    sandstorm.timer--;
    if(!sandstorm.active && Math.random()<0.002){
      sandstorm.active = true;
      sandstorm.timer = 300;
      wrap.classList.add('sandstorm');
    }
    if(sandstorm.active){
      if(sandstorm.timer<=0){ sandstorm.active=false; wrap.classList.remove('sandstorm'); }
    }

    scoreEl.textContent = score;
  }

  function endGame(){
    gameOver = true;
    if(score>best){
      best = score;
      localStorage.setItem('desertSnakeBest', best);
      bestEl.textContent = best;
    }
  }

  function loop(now){
    if(!lastTime) lastTime = now;
    const delta = now - lastTime;
    if(delta > speed){
      step();
      lastTime = now;
      draw();
    }
    requestAnimationFrame(loop);
  }

  // controls
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if(k==='w' || k==='arrowup')    nextDir = {x:0,y:-1};
    else if(k==='s' || k==='arrowdown') nextDir = {x:0,y:1};
    else if(k==='a' || k==='arrowleft') nextDir = {x:-1,y:0};
    else if(k==='d' || k==='arrowright') nextDir = {x:1,y:0};
    else if(k==='p') paused = !paused;
    else if(k==='r') reset();
    // prevent reverse
    if(nextDir.x === -dir.x && nextDir.y === -dir.y) nextDir = {...dir};
  });

  restartBtn.onclick = reset;
  reset();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
