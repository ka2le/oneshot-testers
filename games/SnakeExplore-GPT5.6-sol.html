<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090c">
<title>Snake Frontier</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090c;
    --glass: rgba(8, 11, 15, .62);
    --line: rgba(255, 255, 255, .11);
    --text: #f4f7f8;
    --muted: #87909b;
    --ready: #f4f7f8;
    --cool: #30363e;
    --danger: #ff6b72;
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
  }

  button {
    appearance: none;
    border: 0;
    color: inherit;
    font: inherit;
  }

  #game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    image-rendering: auto;
    background: var(--bg);
  }

  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  .top-left {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .radar-wrap {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(5, 7, 10, .48);
    backdrop-filter: blur(10px);
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
  }

  #radar {
    width: 100%;
    height: 100%;
    display: block;
  }

  .counter-stack {
    display: grid;
    gap: 6px;
  }

  .counter {
    min-height: 30px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(5, 7, 10, .48);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, .18);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }

  .counter svg {
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
    opacity: .9;
  }

  .top-right {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }

  .icon-button {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(5, 7, 10, .52);
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }

  .icon-button:hover {
    background: rgba(255, 255, 255, .07);
    border-color: rgba(255, 255, 255, .18);
  }

  .icon-button:active {
    transform: scale(.94);
  }

  .icon-button svg {
    width: 19px;
    height: 19px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .spells {
    position: absolute;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: end;
    gap: 9px;
    pointer-events: auto;
  }

  .spell {
    --cooldown: 0%;
    --energy: 1;
    position: relative;
    width: 58px;
    height: 58px;
    padding: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(6, 8, 11, .62);
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: transform .1s ease, border-color .15s ease, opacity .15s ease;
  }

  .spell:hover {
    border-color: rgba(255, 255, 255, .23);
  }

  .spell:active {
    transform: translateY(1px) scale(.95);
  }

  .spell::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--cooldown);
    background: rgba(100, 108, 118, .72);
    z-index: 2;
    pointer-events: none;
    transition: height .08s linear;
    mix-blend-mode: normal;
  }

  .spell::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, calc(.05 + var(--energy) * .08));
    pointer-events: none;
    z-index: 4;
  }

  .spell.unavailable {
    opacity: .38;
  }

  .spell.locked {
    opacity: .14;
    filter: grayscale(1);
    transform: scale(.92);
    pointer-events: none;
  }

  .spell.locked::after {
    border-style: dashed;
    border-color: rgba(255, 255, 255, .16);
  }

  .counter.level svg { color: #8ab9ff; }
  .counter.lives svg { color: #ff7890; fill: rgba(255, 120, 144, .16); }

  .spell svg {
    width: 27px;
    height: 27px;
    position: relative;
    z-index: 3;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35));
  }

  .spell .pips {
    position: absolute;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 3px;
  }

  .spell .pips i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
    opacity: .78;
  }

  .spell.ready {
    box-shadow: 0 8px 30px rgba(255, 255, 255, .04), inset 0 0 24px rgba(255, 255, 255, .025);
  }

  .death {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(3, 4, 6, .36);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
    pointer-events: none;
  }

  .death.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .death-core {
    display: grid;
    gap: 14px;
    justify-items: center;
  }

  .death-mark {
    width: 92px;
    height: 92px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 107, 114, .26);
    background: rgba(255, 107, 114, .075);
    color: #ff7078;
  }

  .death-mark svg {
    width: 44px;
    height: 44px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .restart {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .16);
    background: rgba(7, 9, 12, .75);
    display: grid;
    place-items: center;
    color: white;
    cursor: pointer;
    pointer-events: auto;
  }

  .restart svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hit-vignette {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: radial-gradient(circle, transparent 35%, rgba(255, 49, 65, .28) 100%);
    pointer-events: none;
  }

  .flash-vignette {
    position: absolute;
    inset: 0;
    opacity: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, .08), rgba(255, 255, 255, .34));
    pointer-events: none;
    mix-blend-mode: screen;
  }

  @media (max-width: 700px) {
    .top-left {
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
    }

    .top-right {
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
    }

    .radar-wrap {
      width: 62px;
      height: 62px;
    }

    .counter {
      min-height: 27px;
      padding: 4px 8px;
      font-size: 11px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
    }

    .spells {
      bottom: max(12px, env(safe-area-inset-bottom));
      gap: 7px;
    }

    .spell {
      width: 52px;
      height: 52px;
      border-radius: 15px;
    }

    .spell svg {
      width: 24px;
      height: 24px;
    }
  }
</style>
</head>

      glow: "rgba(215, 223, 153, .25)",
      baseScore: 180,
      baseMove: 340,
      hp: 1,
      size: .31,

      eatGrow: 1
    },
    stalker: {

      glow: "rgba(255, 122, 128, .3)",
      baseScore: 320,
      baseMove: 290,

    },
    hunter: {

      baseMove: 310,
      hp: 2,
      size: .44,
      vision: 42,
      contactCost: 5,
      edibleLevel: 9,
      eatGrow: 3
    }
  };

  const SPELLS = {
    trail: {
      cooldown: 9000,
      cost: 4,
      minLength: MIN_LENGTH + 4,
      unlockLevel: 1,
      color: "#9eea9d"
    },

      cost: 6,
