<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            font-family: Arial, sans-serif;
        }

        .game {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            color: white;
            text-align: center;
            font-size: 24px;
            margin: 20px;
        }

        .player {
            background-color: white;
            padding: 20px;
            border: 2px solid green;
            border-radius: 10px;
        }

        .game__controls {
            margin-bottom: 20px;
        }

        .game__btn {
            margin-right: 10px;
            padding: 5px 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<game>
    <div class="game">
        <div class="player" style="background-color: white;"></div>
        <div class="game__controls" style="margin: 20px;"></div>
    </div>
</game>

<script>
    function updateGame() {
        const player = document.querySelector('.player');
        const snake = document.querySelector('.game__snake');

        snake.style.bottom = '0';
        snake.style.left = '50%';
        snake.style.top = '50%';
        snake.style.left = '0';
    }

    function resetGame() {
        updateGame();
    }

    window.onload = resetGame;
</script>

</body>
</html>
