<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101a1e">
<meta name="description" content="A wordless collection of curious little puzzle rooms. One file. No dependencies.">
<title>Elsewhere</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a1e}body{font-family:system-ui;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}button{position:fixed;z-index:2;width:44px;height:44px;border:1px solid #ffffff16;border-radius:50%;background:#152126bb;color:#c5d6d0;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s;touch-action:manipulation}button:hover{background:#304448;transform:scale(1.06)}button:focus-visible{outline:2px solid #b6efcc;outline-offset:5px}button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#sound{left:max(22px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top))}#pause{right:max(22px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top))}#retry{right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom))}@media(max-width:600px){button{width:38px;height:38px}#sound{left:14px;top:14px}#pause{right:14px;top:14px}#retry{right:14px;bottom:14px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Wordless puzzle rooms. Use pointer clicks and drags. Escape pauses, R restarts this room. Arrow keys rotate in rotation rooms. Progress saves automatically."></canvas>
<button id="sound" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M10 5 5 9H2v6h3l5 4zM14 8q5 4 0 8M17 4q9 8 0 16"/></svg></button>
<button id="pause" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
<button id="retry" aria-label="Restart this room"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
<script>
'use strict';
/* ELSEWHERE — a wordless puzzle cabinet.
   Add rooms to ROOMS below. Each room is a { type, ...options } object.
   A mechanic implements init(), draw(), and optional update/down/move/up/key.
   Coordinates use a 1000 × 760 artboard. Nothing is fetched from the network. */
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const TAU=Math.PI*2,clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mod=(a,b)=>(a%b+b)%b;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,scale=1,ox=0,oy=0,dpr=1,t=0,last=0,dt=0;
let pointer={x:-1000,y:-1000,down:false},particles=[],ripples=[],motif=0;
let room,level=0,roomTime=0,totalTime=0,idle=0,paused=false,won=false,winTime=0,transition=1,muted=false,audio=null,saveClock=0;
let results=[],best={},seed=1,shake=0,flash=0,started=false;
const palettes=[['#f28b72','#b6efcf','#e8c981'],['#adc8f5','#f5b680','#c1e7c5'],['#d8b0e9','#b9e8d9','#e5c77b'],['#eecb72','#a9d4e4','#f1a29b'],['#a3deca','#eea8be','#d5d5ee']];
let C={a:palettes[0][0],b:palettes[0][1],c:palettes[0][2],ink:'#102025',line:'#3c5257',paper:'#e7eee2',dim:'#6b8589'};
// Campaign pacing: eight introductions, then familiar returns between discoveries.
// Short tactile rooms separate the longer observation and spatial challenges.
const ROOMS=[
 // Opening: launch / chase / observe / swipe / time / reveal / think / watch.
 {type:'slingshot',par:16},
 {type:'chase',hits:3,par:7},
 {type:'feed',par:14},
 {type:'cut',ropes:3,par:9},
 {type:'orbit',rounds:2,par:10},
 {type:'zipper',par:8},
 {type:'untangle',count:5,par:22},
 {type:'shell',swaps:3,par:12},
 // The first return. Then two discoveries between each familiar beat.
 {type:'slingshot',moving:true,par:22},
 {type:'plant',par:16},
 {type:'gravity',par:20},
 {type:'cut',ropes:5,par:10},
 {type:'crank',turns:2,par:14},
 {type:'camera',rounds:3,par:16},
 {type:'orbit',rounds:3,reverse:true,par:15},
 {type:'sneeze',par:12},
 {type:'shadow',par:12},
 {type:'feed',fussy:true,par:16},
 {type:'maze',variant:0,par:14},
 {type:'laser',count:2,par:10},
 {type:'shell',swaps:5,fast:true,par:14},
 {type:'stack',count:3,par:18},
 {type:'rotate',rounds:1,par:7},
 {type:'untangle',count:6,par:26},
 {type:'herd',count:5,par:24},
 {type:'memory',length:3,par:12},
 {type:'gravity',speed:140,par:24},
 {type:'portal',par:12},
 // Second act: more callbacks, with unfamiliar rooms still arriving.
 {type:'camera',rounds:4,small:true,par:22},
 {type:'trace',count:6,par:10},
 {type:'crank',turns:3,par:18},
 {type:'socket',count:3,par:12},
 {type:'chase',hits:5,decoy:true,warp:true,par:13},
 {type:'balance',couple:false,par:12},
 {type:'laser',count:4,par:18},
 {type:'scratch',par:8},
 {type:'sort',count:6,par:12},
 {type:'herd',count:7,par:28},
 {type:'odd',rounds:2,count:6,par:10},
 {type:'sneeze',par:11},
 {type:'hold',rounds:2,par:9},
 {type:'lights',scramble:2,par:12},
 {type:'stack',count:4,par:23},
 {type:'shadow',moving:true,par:16},
 {type:'memory',length:4,rotate:true,par:18},
 {type:'zipper',reverse:true,par:9},
 {type:'orbit',rounds:3,reverse:true,narrow:true,par:17},
 {type:'portal',par:12}
];
// The encore favors the most expressive rooms, rather than repeating the whole catalog.
const ENCORE=['slingshot','feed','orbit','untangle','shell','gravity','crank','camera','laser','herd','maze','stack','cut','rotate','memory','shadow','sneeze','zipper'];
function rng(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function pick(n){return Math.floor(rng()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=pick(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function readSave(){try{let s=JSON.parse(localStorage.getItem('elsewhere.rhythm.v1')||'null');if(s&&Number.isInteger(s.level)&&s.level>=0&&s.level<100000){level=s.level;totalTime=+s.totalTime||0;muted=!!s.muted;results=Array.isArray(s.results)?s.results.slice(-60):[];best=s.best&&typeof s.best==='object'?s.best:{}}}catch(e){}}
function save(){try{localStorage.setItem('elsewhere.rhythm.v1',JSON.stringify({level,totalTime,muted,results:results.slice(-60),best}))}catch(e){}}
function tone(freq=440,duration=.1,type='sine',volume=.045,slide=0){if(muted)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function tick(n=0){tone(280+n*85,.12,'sine',.06,180)}
function wrong(x=500,y=380){shake=5;flash=.2;burst(x,y,C.a,9);tone(115,.15,'triangle',.035,-35)}
function burst(x,y,color=C.b,n=22){for(let i=0;i<n;i++){let a=rng()*TAU,s=30+rng()*160;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.45+rng()*.65,max:1.1,r:2+rng()*3,color})}}
function ripple(x,y,color=C.b){ripples.push({x,y,r:8,life:.7,color})}
function success(){if(won)return;won=true;winTime=0;let stars=roomTime<=room.opts.par?3:roomTime<=room.opts.par*2?2:1;results.push(stars);best[level]=Math.min(best[level]||Infinity,roomTime);room.rating=stars;burst(500,365,C.b,65);ripple(500,365,C.b);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.04),i*85));save()}
function step(x,y,n=0){burst(x,y,C.b,12);ripple(x,y,C.b);tick(n);idle=0}
function rr(x,y,w,h,r=14,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function circle(x,y,r,fill,stroke,lw=1){ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,color=C.line,width=2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function arc(x,y,r,start,end,color,width=3){ctx.beginPath();ctx.arc(x,y,r,start,end);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.stroke()}
function glow(x,y,r,color,alpha=.15){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');circle(x,y,r,g);ctx.restore()}
function diamond(x,y,r,color){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);rr(-r/2,-r/2,r,r,2,color);ctx.restore()}
function dots(count,filled,y=570){for(let i=0;i<count;i++){let x=500+(i-(count-1)/2)*24;circle(x,y,4,i<filled?C.b:'#33494e');if(i<filled)glow(x,y,14,C.b,.15)}}
function socket(x,y,r=40){circle(x,y+3,r+5,'#0b171c');circle(x,y,r,'#132328',C.line,1.5);arc(x,y,r-5,Math.PI,TAU,'#08181d',2)}
function button(x,y,r=43,color=C.a,pressed=false){glow(x,y,r*2,color,.12);circle(x,y+7,r+5,'#09161a');circle(x,y+2,r+5,'#30454a','#526368',1);let g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,color);g.addColorStop(1,color+'bb');circle(x,y+(pressed?4:0),r,g);arc(x,y+(pressed?4:0),r-5,3.65,5.5,'#ffffff50',2);circle(x,y+(pressed?4:0),r-10,null,'#10202520',1)}
function arrow(x,y,angle=0,color=C.paper,size=16){ctx.save();ctx.translate(x,y);ctx.rotate(angle);line(-size,0,size,0,color,3);line(size,0,size-7,-7,color,3);line(size,0,size-7,7,color,3);ctx.restore()}
function rotateIcon(x,y,reverse=false,color=C.paper){ctx.save();ctx.translate(x,y);ctx.scale(reverse?-1:1,1);arc(0,0,13,-.7,4.5,color,2.5);line(11,-9,13,-1,color,2.5);line(13,-1,5,-3,color,2.5);ctx.restore()}
function hand(x,y,dragX=0,dragY=0){if(idle<7)return;let p=mod(t*.55,1),a=Math.sin(p*Math.PI)*.5;ctx.save();ctx.globalAlpha=a;let xx=x+dragX*p,yy=y+dragY*p;circle(xx,yy,17,null,C.paper,2);circle(xx,yy,5,C.paper);if(dragX||dragY){ctx.setLineDash([3,8]);line(x,y,x+dragX,y+dragY,C.paper,1);ctx.setLineDash([])}ctx.restore()}
function shape(x,y,r,kind=0,color=C.a,angle=0,outline=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.beginPath();if(kind===0){ctx.moveTo(0,-r);ctx.lineTo(r*.9,r*.65);ctx.lineTo(-r*.9,r*.65);ctx.closePath()}else if(kind===1){ctx.roundRect(-r*.78,-r*.78,r*1.56,r*1.56,8)}else if(kind===2){for(let i=0;i<6;i++){let a=i*TAU/6-Math.PI/2;let xx=Math.cos(a)*r,yy=Math.sin(a)*r;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath()}else if(kind===3){ctx.moveTo(-r*.6,-r);ctx.lineTo(r*.35,-r);ctx.lineTo(r*.35,-r*.2);ctx.lineTo(r,r*.45);ctx.lineTo(r*.3,r);ctx.lineTo(-r*.6,r);ctx.closePath()}else{for(let i=0;i<10;i++){let a=i*TAU/10-Math.PI/2,rad=i%2?r*.48:r;i?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath()}if(outline){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}else{ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#ffffff25';ctx.lineWidth=1.5;ctx.stroke()}ctx.restore()}
function sigil(x,y,index,color=C.dim,r=12){let n=3+index%5;ctx.save();ctx.translate(x,y);ctx.rotate(index*.7);circle(0,0,r,null,color,1);for(let i=0;i<n;i++){let a=i*TAU/n;line(Math.cos(a)*r*.45,Math.sin(a)*r*.45,Math.cos(a)*r,Math.sin(a)*r,color,1.5)}circle(0,0,2,color);ctx.restore()}
function hover(p,r=40){return dist(pointer,p)<r}
const mechanics={};

// 01 · A button that learns to escape.
mechanics.chase={
 init(o){this.n=0;this.x=500;this.y=355;this.tx=500;this.ty=355;this.r=49;this.trail=[];this.phase=rng()*TAU},
 update(){let speed=this.n>2?1:0;if(speed&&!won){this.phase+=dt*(this.opts.warp?1.35:1);let k=this.n;this.tx=500+Math.sin(this.phase*1.5)*Math.min(245,85+k*24);this.ty=355+Math.sin(this.phase*2.1)*Math.min(125,35+k*17)}this.x=lerp(this.x,this.tx,1-Math.exp(-dt*10));this.y=lerp(this.y,this.ty,1-Math.exp(-dt*10));this.trail.push({x:this.x,y:this.y});if(this.trail.length>20)this.trail.shift()},
 draw(){for(let j=0;j<3;j++){circle(500,355,105+j*62,null,'#34494c55',1);arc(500,355,105+j*62,t*.12+j,t*.12+j+.5,C.line,3)}for(let i=0;i<8;i++){let a=i*TAU/8;sigil(500+Math.cos(a)*270,355+Math.sin(a)*178,i,'#3b5155',8)}this.trail.forEach((p,i)=>{ctx.globalAlpha=i/this.trail.length*.12;circle(p.x,p.y,this.r,C.a)});ctx.globalAlpha=1;if(this.opts.decoy&&this.n>0){let dx=1000-this.x,dy=710-this.y;button(dx,dy,this.r,C.dim);circle(dx,dy,11,null,C.ink,3);line(dx-8,dy-8,dx+8,dy+8,C.ink,3)}button(this.x,this.y,this.r,C.a,pointer.down&&hover(this,this.r));circle(this.x,this.y,12,C.ink);circle(this.x,this.y,5,C.a);arc(this.x,this.y,this.r+14,-Math.PI/2,-Math.PI/2+TAU*this.n/this.opts.hits,C.b,3);dots(this.opts.hits,this.n);hand(this.x,this.y)},
 down(p){if(dist(p,this)<this.r+5){step(this.x,this.y,this.n);this.n++;if(this.n>=this.opts.hits)success();else{this.tx=250+rng()*500;this.ty=230+rng()*250;this.phase+=1.7}}else if(this.opts.decoy&&dist(p,{x:1000-this.x,y:710-this.y})<this.r)wrong(p.x,p.y)}
};

// 02 · Turn the key until the silhouettes agree.
mechanics.rotate={
 init(){this.n=0;this.angle=pick(8);this.target=mod(this.angle+2+pick(5),8);this.visual=this.angle*Math.PI/4;this.targetVisual=this.target*Math.PI/4;this.match=0},
 draw(){let x=500,y=330;circle(x,y,143,null,C.line,1);for(let i=0;i<32;i++){let a=i*TAU/32;line(x+Math.cos(a)*137,y+Math.sin(a)*137,x+Math.cos(a)*(i%4?131:125),y+Math.sin(a)*(i%4?131:125),i%4?C.line:C.dim,2)}glow(x,y,145,C.b,.08);shape(x,y,102,3,'#07171c',this.targetVisual);shape(x,y,102,3,C.b,this.targetVisual,true);shape(x,y,80,3,C.a,this.visual);circle(x,y,18,C.ink,'#ffffff30',1);circle(x,y,6,C.c);button(380,520,34,C.b);button(620,520,34,C.b);rotateIcon(380,520,true,C.ink);rotateIcon(620,520,false,C.ink);if(this.opts.reverse){line(421,520,480,495,C.line,2);line(520,495,579,520,C.line,2);line(421,495,579,545,C.line,2);arrow(455,533,0,C.dim,8);arrow(545,507,Math.PI,C.dim,8)}dots(this.opts.rounds,this.n,600);hand(620,520)},
 update(){this.visual=lerp(this.visual,this.angle*Math.PI/4,1-Math.exp(-dt*14));this.targetVisual=lerp(this.targetVisual,this.target*Math.PI/4,1-Math.exp(-dt*9));if(mod(this.angle,8)===mod(this.target,8)){this.match+=dt;if(this.match>.3){this.n++;step(500,330,this.n);this.match=0;if(this.n>=this.opts.rounds)success();else this.target+=2+pick(5)}}else this.match=0},
 turn(d){this.angle+=d*(this.opts.reverse?-1:1);tick();idle=0},
 down(p){if(dist(p,{x:380,y:520})<44)this.turn(-1);if(dist(p,{x:620,y:520})<44)this.turn(1)},
 key(k){if(k==='ArrowLeft')this.turn(-1);if(k==='ArrowRight')this.turn(1)}
};

// 03 · Objects and their shadows.
mechanics.socket={
 init(o){this.items=Array.from({length:o.count},(_,i)=>({x:250+i*500/(o.count-1),y:480,homeX:250+i*500/(o.count-1),homeY:480,kind:i,placed:false}));this.order=shuffle(Array.from({length:o.count},(_,i)=>i));this.drag=-1;this.n=0},
 target(i){let slot=this.order.indexOf(i);return{x:250+slot*500/(this.opts.count-1),y:275+(this.opts.drift?Math.sin(t*.8+slot*1.7)*27:0)}},
 draw(){line(215,375,785,375,C.line,1);for(let i=0;i<11;i++)circle(250+i*50,375,2,C.line);this.items.forEach((s,i)=>{let q=this.target(i);socket(q.x,q.y,49);shape(q.x,q.y,31,s.kind,s.placed?C.b:'#476064',0,true);if(s.placed){shape(q.x,q.y,29,s.kind,C.b);circle(q.x,q.y+67,3,C.b)}else{line(s.homeX-20,543,s.homeX+20,543,C.line,2)}});this.items.forEach((s,i)=>{if(s.placed)return;let lift=i===this.drag;glow(s.x,s.y,65,C.a,lift?.22:.06);shape(s.x,s.y+(lift?12:7),36,s.kind,'#0b171b');shape(s.x,s.y,36,s.kind,C.a);if(lift)circle(s.x,s.y,51,null,C.a+'66',1)});dots(this.opts.count,this.n,602);let i=this.items.findIndex(s=>!s.placed);if(i>=0){let s=this.items[i],q=this.target(i);hand(s.x,s.y,q.x-s.x,q.y-s.y)}},
 down(p){for(let i=this.items.length-1;i>=0;i--)if(!this.items[i].placed&&dist(p,this.items[i])<49){this.drag=i;this.offset={x:this.items[i].x-p.x,y:this.items[i].y-p.y};tick();break}},
 move(p){if(this.drag<0)return;let s=this.items[this.drag];s.x=clamp(p.x+this.offset.x,160,840);s.y=clamp(p.y+this.offset.y,190,555)},
 up(){if(this.drag<0)return;let s=this.items[this.drag],q=this.target(this.drag);if(dist(s,q)<49){s.placed=true;this.n++;step(q.x,q.y,this.n);if(this.n===this.opts.count)success()}else{s.x=s.homeX;s.y=s.homeY;tone(170,.1)}this.drag=-1}
};

// 04 · A small moving moon and a very particular orbit.
mechanics.orbit={
 init(){this.a=-Math.PI/2;this.target=.3;this.n=0;this.dir=1;this.cool=0},
 update(){this.a+=dt*(1.15+this.n*.18)*this.dir;this.cool=Math.max(0,this.cool-dt)},
 draw(){let r=142,half=this.opts.narrow?.16:.24;for(let i=0;i<60;i++){let a=i*TAU/60;line(500+Math.cos(a)*(r+19),350+Math.sin(a)*(r+19),500+Math.cos(a)*(r+23+(i%5===0?5:0)),350+Math.sin(a)*(r+23+(i%5===0?5:0)),C.line,1.5)}circle(500,350,r,null,'#0a181d',16);circle(500,350,r,null,C.line,1);arc(500,350,r,this.target-half,this.target+half,C.b,18);let x=500+Math.cos(this.a)*r,y=350+Math.sin(this.a)*r;for(let i=1;i<8;i++){ctx.globalAlpha=(1-i/8)*.2;circle(500+Math.cos(this.a-i*.045*this.dir)*r,350+Math.sin(this.a-i*.045*this.dir)*r,9,C.a)}ctx.globalAlpha=1;circle(x,y,13,C.a,C.ink,3);button(500,350,57,this.cool?C.c:C.a,pointer.down);circle(500,350,18,null,C.ink,2);circle(500,350,5,C.ink);dots(this.opts.rounds,this.n,570);hand(500,350)},
 hit(){if(this.cool)return;let delta=Math.abs(Math.atan2(Math.sin(this.a-this.target),Math.cos(this.a-this.target)));if(delta<(this.opts.narrow?.20:.29)){this.n++;step(500+Math.cos(this.a)*142,350+Math.sin(this.a)*142,this.n);if(this.n===this.opts.rounds)success();else{this.target=this.a+(1.2+rng()*2)*this.dir;if(this.opts.reverse){this.dir*=-1;this.target=this.a+(1.2+rng()*2)*this.dir}}}else{wrong(500,350);this.cool=.3}},
 down(p){if(dist(p,{x:500,y:350})<72)this.hit()},key(k){if(k===' ')this.hit()}

function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/.5,0,1);circle(p.x,p.y,p.r,p.color)});ctx.globalAlpha=1;ripples.forEach(p=>{ctx.globalAlpha=p.life/.7;circle(p.x,p.y,p.r,null,p.color,1.5)});ctx.globalAlpha=1;}
function pauseScreen(){ctx.fillStyle='#061216d9';ctx.fillRect(0,0,1000,760);glow(500,375,210,C.b,.07);circle(500,375,98,null,C.line,1);button(500,375,56,C.b);ctx.beginPath();ctx.moveTo(489,354);ctx.lineTo(489,396);ctx.lineTo(520,375);ctx.closePath();ctx.fillStyle=C.ink;ctx.fill();button(350,375,29,C.dim);rotateIcon(350,375,false,C.ink);button(650,375,29,C.dim);if(muted){line(641,366,659,384,C.ink,2);line(659,366,641,384,C.ink,2)}else{arc(643,375,12,-1,1,C.ink,2);arc(643,375,19,-1,1,C.ink,2)}}
function frame(now){if(!last)last=now;dt=Math.min(.035,(now-last)/1000);last=now;if(!paused){t+=dt;idle+=dt;transition=Math.max(0,transition-dt*2.8);if(!won&&transition<.1){if(started){roomTime+=dt;totalTime+=dt}room.update?.()}if(won){winTime+=dt;if(winTime>1.35){loadRoom(level+1)}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);ripples.forEach(p=>{p.r+=dt*110;p.life-=dt});ripples=ripples.filter(p=>p.life>0);shake=Math.max(0,shake-dt*23);flash=Math.max(0,flash-dt);saveClock+=dt;if(saveClock>8){saveClock=0;save()}}background();ctx.save();if(shake&&!reduced)ctx.translate(Math.sin(t*91)*shake,Math.cos(t*77)*shake*.5);cabinet();ctx.save();ctx.beginPath();ctx.roundRect(138,138,724,484,23);ctx.clip();if(transition>0){ctx.globalAlpha=1-transition;ctx.translate(0,reduced?0:transition*35)}room.draw();ctx.restore();drawParticles();if(won){let k=clamp(winTime*3,0,1);ctx.globalAlpha=k;for(let i=0;i<3;i++)diamond(478+i*22,652,8,i<room.rating?C.c:C.line);ctx.globalAlpha=1;rr(126,126,748,508,34,null,C.b+'88',2)}if(flash)rr(126,126,748,508,34,null,C.a+'77',2);ctx.restore();ribbon();if(paused)pauseScreen();requestAnimationFrame(frame)}
function point(e){return{x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
function cancelGesture(){pointer.down=false;if(room){if('drag'in room)room.drag=typeof room.drag==='number'?-1:false;if(room.holding){room.holding=false;room.p=0}if(room.drawing){room.drawing=false;room.n=0}}}
function setPause(v){paused=v;cancelGesture();document.getElementById('pause').setAttribute('aria-label',v?'Resume':'Pause');document.getElementById('pause').setAttribute('aria-pressed',String(v));document.getElementById('pause').innerHTML=v?'<svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>';last=performance.now();save()}
function soundButton(){document.getElementById('sound').setAttribute('aria-label',muted?'Enable sound':'Mute sound');document.getElementById('sound').setAttribute('aria-pressed',String(muted));document.getElementById('sound').innerHTML=muted?'<svg viewBox="0 0 24 24"><path d="M10 5 5 9H2v6h3l5 4zM15 8l7 8M22 8l-7 8"/></svg>':'<svg viewBox="0 0 24 24"><path d="M10 5 5 9H2v6h3l5 4zM14 8q5 4 0 8M17 4q9 8 0 16"/></svg>'}
function toggleSound(){muted=!muted;soundButton();if(!muted)tick();save()}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointer={...point(e),down:true};started=true;if(paused){if(dist(pointer,{x:500,y:375})<68)setPause(false);else if(dist(pointer,{x:350,y:375})<38){loadRoom(level);setPause(false)}else if(dist(pointer,{x:650,y:375})<38)toggleSound();return}if(won||transition>.35)return;idle=0;if(audio?.state==='suspended')audio.resume();room.down?.(pointer)});
canvas.addEventListener('pointermove',e=>{Object.assign(pointer,point(e));if(!paused&&!won&&transition<.35)room.move?.(pointer);canvas.style.cursor=pointer.down?'grabbing':'default'});
canvas.addEventListener('pointerup',e=>{Object.assign(pointer,point(e));if(!paused&&!won)room.up?.(pointer);pointer.down=false;canvas.style.cursor='default'});
canvas.addEventListener('pointercancel',cancelGesture);
document.getElementById('pause').addEventListener('click',()=>setPause(!paused));
document.getElementById('sound').addEventListener('click',toggleSound);
document.getElementById('retry').addEventListener('click',()=>{loadRoom(level);if(paused)setPause(false);tick()});
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;if(e.key==='Escape'){setPause(!paused);return}if(e.key.toLowerCase()==='r'){loadRoom(level);return}if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(!paused&&!won&&!e.repeat){started=true;idle=0;room.key?.(e.key,false)}}});
window.addEventListener('keyup',e=>{if(!paused&&!won&&room.opts.type==='hold')room.key?.(e.key,true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)setPause(true)});
window.addEventListener('blur',()=>{if(started&&!paused)setPause(true)});
window.addEventListener('resize',resize);window.addEventListener('pagehide',save);
readSave();resize();loadRoom(level);soundButton();requestAnimationFrame(frame);
})();
