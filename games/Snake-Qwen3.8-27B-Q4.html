<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
}

.game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 4px;
}

.score-display {
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1px;
}

.score-display span {
    color: #4ade80;
}

.high-score {
    color: #888;
    font-size: 0.95rem;
}

.high-score span {
    color: #fbbf24;
}

canvas {
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(74, 222, 128, 0.08), 0 0 120px rgba(74, 222, 128, 0.04);
}

.controls {
    display: flex;
    gap: 12px;
    align-items: center;
}

.btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
}

.btn:hover {
    background: rgba(74, 222, 128, 0.15);
    border-color: rgba(74, 222, 128, 0.3);
    color: #4ade80;
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    z-index: 10;
    transition: opacity 0.3s;
}

.overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.overlay h2 {
    color: #fff;
    font-size: 2.2rem;
    margin-bottom: 8px;
}

.overlay p {
    color: #888;
    font-size: 1rem;
    margin-bottom: 24px;
}

.overlay .final-score {
    color: #4ade80;
    font-size: 1.3rem;
    margin-bottom: 24px;
    font-weight: 700;
}

.food-legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
}

.food-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #888;
    font-size: 0.85rem;
}

.food-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}

.food-dot.normal { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
.food-dot.golden { background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.5); }
.food-dot.star { background: #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,0.5); }
</style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="high-score">Best: <span id="highScore">0</span></div>
    </div>
    <canvas id="game"></canvas>
    <div class="controls">
        <button class="btn" id="restartBtn">Restart</button>
    </div>
    <div class="food-legend">
        <div class="food-item"><div class="food-dot normal"></div> +10</div>
        <div class="food-item"><div class="food-dot golden"></div> +25</div>
        <div class="food-item"><div class="food-dot star"></div> +50</div>
    </div>
</div>

<div class="overlay" id="overlay">
    <h2 id="overlayTitle">🐍 Snake</h2>
    <p id="overlayMsg">Eat food, grow long, don't crash</p>
    <div class="final-score" id="finalScore" style="display:none"></div>
    <button class="btn" id="startBtn" style="padding:12px 32px; font-size:1.1rem;">Start Game</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const finalScoreEl = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

const COLS = 24;
const ROWS = 24;
const CELL = 24;
const SIZE = COLS * CELL;

canvas.width = SIZE;
canvas.height = SIZE;

let snake, direction, nextDirection, foods = [], score, highScore, gameRunning, gameSpeed, lastTime, accumulator;

let particles = [];
let foodPulse = 0;

highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
highScoreEl.textContent = highScore;

const FOOD_TYPES = [
    { type: 'normal', color: '#ef4444', glow: 'rgba(239,68,68,0.4)', points: 10, chance: 0.7 },
    { type: 'golden', color: '#fbbf24', glow: 'rgba(251,191,36,0.4)', points: 25, chance: 0.22 },
    { type: 'star', color: '#a78bfa', glow: 'rgba(167,139,250,0.4)', points: 50, chance: 0.08 }
];

function pickFoodType() {
    const r = Math.random();
    let cumulative = 0;
    for (const ft of FOOD_TYPES) {
        cumulative += ft.chance;
        if (r <= cumulative) return ft;
    }
    return FOOD_TYPES[0];
}

function randomFood() {
    let pos;
    do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y) || foods.some(f => f.x === pos.x && f.y === pos.y));
    const type = pickFoodType();
    return { x: pos.x, y: pos.y, ...type, scale: 0, maxScale: 1 };
}

function init() {
    snake = [{ x: 11, y: 11 }, { x: 10, y: 11 }, { x: 9, y: 11 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    foods = [randomFood()];
    score = 0;
    gameSpeed = 8;
    particles = [];
    scoreEl.textContent = '0';
    lastTime = 0;
    accumulator = 0;
}

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 1.5 + Math.random() * 2;
        particles.push({
            x: x * CELL + CELL / 2,
            y: y * CELL + CELL / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color,
            size: 3 + Math.random() * 3
        });
    }
}

function update(dt) {
    if (!gameRunning) return;

    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    let ate = false;
    for (let i = 0; i < foods.length; i++) {
        const f = foods[i];
        if (head.x === f.x && head.y === f.y) {
            score += f.points;
            scoreEl.textContent = score;
            addParticles(f.x, f.y, f.color, f.type === 'star' ? 14 : 8);
            foods.splice(i, 1);
            ate = true;
            if (foods.length < 2 && Math.random() < 0.7) foods.push(randomFood());
            if (foods.length < 3 && Math.random() < 0.3) foods.push(randomFood());
            gameSpeed = Math.min(16, 8 + Math.floor(score / 50));
            break;
        }
    }

    if (!ate) snake.pop();

    for (let i = 0; i < foods.length; i++) {
        if (foods[i].scale < foods[i].maxScale) foods[i].scale += dt * 4;
    }
}

function gameOver() {
    gameRunning = false;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
    }
    overlayTitle.textContent = '💀 Game Over';
    overlayMsg.textContent = 'You crashed!';
    finalScoreEl.style.display = 'block';
    finalScoreEl.textContent = `Score: ${score}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
}

function draw() {
    ctx.fillStyle = '#0f1117';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(SIZE, i * CELL);
        ctx.stroke();
    }

    // Food
    foodPulse += 0.05;
    foods.forEach(f => {
        const cx = f.x * CELL + CELL / 2;
        const cy = f.y * CELL + CELL / 2;
        const pulse = 1 + Math.sin(foodPulse * 3) * 0.1;
        const r = (CELL / 2 - 3) * f.scale * pulse;

        // Glow
        ctx.shadowColor = f.glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(r, 1), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner highlight
        if (f.type === 'star') {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(cx - 2, cy - 2, Math.max(r * 0.3, 0.5), 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Snake
    for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const t = i / snake.length;
        const padding = 2 + t * 1.5;
        const radius = 5;

        const r = Math.round(74 - t * 30);
        const g = Math.round(222 - t * 80);
        const b = Math.round(128 - t * 30);

        ctx.fillStyle = `rgb(${r},${g},${b})`;

        if (i === 0) {
            ctx.shadowColor = 'rgba(74, 222, 128, 0.3)';
            ctx.shadowBlur = 10;
        }

        roundRect(seg.x * CELL + padding, seg.y * CELL + padding, CELL - padding * 2, CELL - padding * 2, radius);
        ctx.shadowBlur = 0;

        // Eyes on head
        if (i === 0) {
            ctx.fillStyle = '#fff';
            const ex = direction.x === 0 ? -3 : 0;
            const ey = direction.y === 0 ? -3 : 0;
            const cx1 = seg.x * CELL + CELL / 2 + (direction.x === 1 ? 4 : direction.x === -1 ? -4 : -4 + ex);
            const cy1 = seg.y * CELL + CELL / 2 + (direction.y === 1 ? 4 : direction.y === -1 ? -4 : -4 + ey);
            const cx2 = seg.x * CELL + CELL / 2 + (direction.x === 1 ? 4 : direction.x === -1 ? -4 : 4 + ex);
            const cy2 = seg.y * CELL + CELL / 2 + (direction.y === 1 ? 4 : direction.y === -1 ? -4 : 4 + ey);

            ctx.beginPath();
            ctx.arc(cx1, cy1, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx2, cy2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(cx1, cy1, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx2, cy2, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        p.vx *= 0.96;
        p.vy *= 0.96;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    if (gameRunning) {
        accumulator += dt;
        const step = 1 / gameSpeed;
        while (accumulator >= step) {
            update(step);
            accumulator -= step;
        }
    }

    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    init();
    gameRunning = true;
    overlay.classList.add('hidden');
}

function handleKey(e) {
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            break;
        case 'ArrowDown': case 's': case 'S':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            break;
        case 'ArrowLeft': case 'a': case 'A':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            break;
        case 'ArrowRight': case 'd': case 'D':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            break;
    }
    e.preventDefault();
}

document.addEventListener('keydown', handleKey);
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
