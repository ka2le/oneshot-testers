<script>
'use strict';
// Everything, including the score and illustrations, is contained in this file.
// Canon: Iona is the sea's stolen name, sewn into the player's stillborn heart.
// The court lowered the castle to contain the unebbing sea. Mara stitched a
// boundary that admits named things; she became its last living stitch.
const ITEMS={
 shield:{name:'Tin shield',desc:'Your father painted a sun inside it. It will turn one fatal bite, then break.',icon:'<path d="M4 3 10 1l6 2v7c0 4-6 8-6 8S4 14 4 10Z"/><path d="M10 5v8M7 8h6"/>'},
 needle:{name:'Silver needle',desc:'For seams between things that should not touch. Using it on a living stitch may leave it behind.',icon:'<path d="m4 18 9-15c2-3 5-1 3 2Z"/><path d="m12 6 2-3"/>'},
 bell:{name:'Empty bell',desc:'A nursery bell. It keeps a sound placed inside it. Turn it over to give the sound back.',icon:'<path d="M4 13c2-2 1-8 6-8s4 6 6 8ZM2 15h16M8 18h4M10 5V2"/>'}
};
const FRAGMENTS={
 letter:{title:'A late postmark',text:'The letter is dated tomorrow. The signature is a small drawing of a wren. Mother always called you that.'},
 rule:{title:'The dry side of the sea',text:'The veil admits anything with a name. Fish pass through it. The water cannot.'},
 ledger:{title:'No drowned servants',text:'The burial book contains seventeen names. Beside each: “Paid. Left by the east stair.” The coffins were for the village to see.'},
 seam:{title:'A seam is not a knot',text:'Mara’s pattern: “Do not cut a borrowed life away. Unpick it. Give its own beat somewhere to wait.”'},
 queen:{title:'The last dance',text:'The queen ordered the castle lowered. All forty servants turned the capstan. No one was chained to it.'},
 chain:{title:'The weight of a house',text:'The palace hangs beneath the old harbour on nine anchor chains. Eight have broken. It did not sink by accident.'},
 origin:{title:'The second heartbeat',text:'You were born without a pulse. The king lent your mother the sea’s name, Iona. She sewed it into your heart.'},
 bell:{title:'A place to keep a sound',text:'The nursery bell can keep a sound without making it. Once, it kept a baby’s first laugh for a father away at sea.'},
 mother:{title:'The living stitch',text:'Mara is still here. When the other stitches wore away, she used herself. Her death notice was a way of keeping you from coming back.'},
 oath:{title:'A promise in gold',text:'The king’s coronation oath: “What is borrowed in my name, my own heart shall repay.” Even a dead king has to keep an oath.'},
 child:{title:'Under the cradle',text:'Two sets of measurements. One for a baby. One for a sea. Both grow when frightened.'},
 ninth:{title:'What the tidekeeper counts',text:'A tide here is not a day. It is a chain giving way. The next one is the last.'}
};
const ENDINGS={
 hounds:{n:1,title:'A place at the table',mood:'bone',epitaph:'The household has one more mouth.',text:['The hounds take you gently. They have been trained not to damage the guests.','By morning, a chair has been laid for you. Your name is written on the little card in your own hand.'],reveal:'In the kitchen, every place setting has teeth marks. The household was hungry long before it drowned.'},
 drowned:{n:2,title:'The quiet below',mood:'water',epitaph:'Even a borrowed heart needs air.',text:['The water is warmer than you expected. Something silver circles your ankle.','Above you, the air is a perfect rectangle. You reach it with your reflection.'],reveal:'The flooded rooms have no current. Whatever the sea is waiting for, it is somewhere inside the house.'},
 shore:{n:3,title:'Dry land',mood:'dawn',epitaph:'A life can be lived beside an unanswered question.',text:['You climb into the wheat. The letter dries to a blank square.','Years later, you wake with a little salt on your pillow. You take to sleeping with the window closed.'],reveal:'The well appears only to people who have received a letter. Your neighbours insist there was never a castle here.'},
 voice:{n:4,title:'A voice upstairs',mood:'dawn',epitaph:'There are smaller ways to bring someone home.',text:['You carry the bell out without turning it over. It is warm against your chest.','On the hardest evenings, you let out one word. There are enough words for almost a lifetime. The last one is your name.'],reveal:'The voice in the bell grows older. Somewhere below, your mother is still speaking.'},
 mother:{n:5,title:'Her hand in yours',mood:'dawn',epitaph:'You save the person you came for.',text:['The needle stays in the seam. Your mother comes away from it with seventeen years of dust in her hair.','You reach the wheat together. Behind you, the last chain holds for one more night. Neither of you mentions the sound beneath the field.'],reveal:'Mara does not ask what you left in her place. She knows how long a silver needle lasts in salt water.'},
 flood:{n:6,title:'The ninth tide',mood:'water',epitaph:'A house returns. A coastline changes.',text:['The last chain breaks. The castle rises through the wheat like a ship through paper.','From the highest window, you watch roads become channels. Every fish knows exactly where to go. None of the people do.'],reveal:'The old maps are accurate again. Your village was built on the bed of a harbour.'},
 keeper:{n:7,title:'The next stitch',mood:'silk',epitaph:'Someone must write the next letter.',text:['You take your mother’s place. For a moment you feel every fish in every room. Then you feel her feet on the stairs, going up.','Years pass like a needle through cloth. You begin a letter. “Little wren,” you write, though you have no child.'],reveal:'The handwriting on the letter you brought was yours. The seam folds more than water.'},
 tide:{n:8,title:'A name returned',mood:'water',epitaph:'The sea remembers how to leave.',text:['“Iona,” you say, and give back what was sewn into you. Your heart rests. The water bows.','It takes your mother home on the gentlest wave. For the rest of her life, the tide comes in a little early on your birthday.'],reveal:'The sea never wanted a sacrifice. It had been calling its own name, and hearing you answer.'},
 king:{n:9,title:'His Majesty, at last',mood:'bone',epitaph:'An old promise finds its owner.',text:['You set the crown over the king’s stopped heart and read his oath. Gold begins to beat.','The seam closes around the throne. You and your mother climb. Far below, for the first time in his reign, the king does something without being thanked.'],reveal:'The king could have paid the debt himself. He had seventeen years to remember his promise.'},
 dawn:{n:10,title:'Small, impossible things',mood:'dawn',epitaph:'A life is more than the thing that started it.',text:['Your own heartbeat waits inside the bell. With the needle, you lift Iona out of it, one silver letter at a time.','The sea slips through the veil. You turn the bell over. Your heart answers in its own small voice.','Outside, your mother takes off her shoes. Neither of you has ever seen the shore at low tide.'],reveal:'The borrowed name started your heart. It was never what kept it beating. Mara had been too afraid to find out.'}
};
const has=(s,id)=>s.items.includes(id),flag=(s,id)=>!!s.flags[id];
const C=(label,to,note='',extra={})=>({label,to,note,...extra});
const SCENES={
 well:{title:'A chimney in the wheat.',chapter:'The invitation',depth:0,mood:'water',note:'The ground remembers<br>a different shape.',text:'A castle chimney has surfaced in the field.\nYour mother’s letter is wet. She died seventeen years ago.',choices:[C('Unfold the letter.','letter'),C('Look into the chimney.','rim')]},
 letter:{title:'Little wren,',chapter:'The invitation',depth:0,mood:'silk',fragment:'letter',text:'<span class="letter">Come before the ninth tide.<br>There is something of yours down here.<br><br>Do not let the king tell you it is a gift.</span>',choices:[C('Keep the letter.','rim'),C('Burn it. Go anyway.','rim','Some doors will stay closed.',{set:{letter:false},danger:true})]},
 rim:{title:'What you can carry.',chapter:'The invitation',depth:0,mood:'bone',text:'Your father’s tin shield. Your mother’s silver needle.\nThe letter fits beside either one.',choices:[C('Take the shield.','landing','Turns one fatal bite.',{add:'shield'}),C('Take the needle.','landing','For things that have been sewn together.',{add:'needle'}),C('Take both. Leave the letter.','landing','Two keepsakes. No invitation.',{add:['shield','needle'],set:{letter:false}}),C('Take only the letter.','landing','Or only your nerve, if it burned.')]},
 landing:{title:'The water stands upright.',chapter:'I · The dry shore',depth:9,mood:'water',note:'A door can be closed<br>to only one thing.',text:'A sheet of sea fills the doorway. A fish swims through it, hangs in the air, then swims back.\nThe flagstones on your side are dry.',choices:[C('Put your hand through.','veil'),C('Ask the fish its name.','fish'),C('Follow the dry corridor.','hall')]},
 veil:{title:'Cold. Then nothing.',chapter:'I · The dry shore',depth:9,mood:'water',fragment:'rule',text:'Your hand passes. Water beads on your sleeve but does not follow.\nIn the doorframe, tiny stitches spell: <em>ONLY WHAT IS NAMED.</em>',choices:[C('Read the repair marks.','repair'),C('Follow the corridor.','hall')]},
 fish:{title:'“Thomas,” says the fish.',chapter:'I · The dry shore',depth:9,mood:'water',fragment:'rule',text:'“Used to be the gardener.”\nHe nods towards the water. “That’s the one that can’t get out.”',choices:[C('Ask what it is waiting for.','fishwait'),C('Thank Thomas.','hall')]},
 fishwait:{title:'It looks at your chest.',chapter:'I · The dry shore',depth:9,mood:'heart',text:'“Oh,” says Thomas.\nHe swims away before you can ask a second question.',choices:[C('Follow the corridor.','hall')]},
 repair:{title:'Seventeen repairs.',chapter:'I · The dry shore',depth:9,mood:'silk',text:'Every new stitch is smaller than the last.\nThe newest one has caught a long grey hair.',choices:[C('Leave it alone.','hall'),C('Unpick a loose thread.','tug','The whole doorway is under strain.',{danger:true})]},
 tug:{title:'A woman gasps.',chapter:'I · The dry shore',depth:9,mood:'heart',text:'Somewhere far below you, someone drops a cup.\nYou let go. The water stands still again.',choices:[C('Find her.','hall')]},
 hall:{title:'The household below.',chapter:'II · The borrowed house',depth:18,mood:'bone',note:'A home does not stop being a home<br>when nobody can leave.',text:s=>`${flag(s,'kitchen')||flag(s,'ballroom')||flag(s,'nursery')?'You return to the landing. The waterline has risen an inch.':'A crab polishes the banister. It pauses to let you pass.'}\nThree passages. Below them, a stair that seems to breathe.`,choices:s=>[...(!flag(s,'kitchen')?[C('The servants’ passage.','kitchen','Something is laying the table.',{set:{kitchen:true}})]:[]),...(!flag(s,'ballroom')?[C('The music gallery.','ballroom','The same three notes, over and over.',{set:{ballroom:true}})]:[]),...(!flag(s,'nursery')?[C('The nursery stair.','nursery','A thread moves against the draught.',{set:{nursery:true}})]:[]),C('Descend the breathing stair.','stair','Leave these rooms behind.')]},
 kitchen:{title:'Dinner for seventeen.',chapter:'II · The servants',depth:22,mood:'bone',text:'Lobsters lay silver forks beside empty plates.\nThe cook holds out a claw for your invitation.',choices:s=>[...(flag(s,'letter')?[C('Show Mother’s letter.','cook','An invitation, at last.')]:[]),C('Help lay the table.','ledger'),C('Take the key from its claw.','hounds','Something growls beneath the table.',{danger:true})]},
 cook:{title:'An extra cup.',chapter:'II · The servants',depth:22,mood:'silk',fragment:'mother',set:{mother:true},text:'The cook reads the little wren at the bottom.\nIt sets out two cups. One has your mother’s lipstick on the rim.',choices:[C('Look at the household book.','ledger'),C('Follow the silver thread.','seamroom')]},
 ledger:{title:'The burial book.',chapter:'II · The servants',depth:23,mood:'bone',fragment:'ledger',set:{ledger:true},text:'Seventeen servants. Seventeen coffins.\nBeside every name: <em>Paid. Left by the east stair.</em>\nThe cook has crossed out “drowned” so hard the paper has torn.',choices:[C('Turn to the royal accounts.','oath'),C('Follow a thread through the pantry.','seamroom')]},
 oath:{title:'The king’s collateral.',chapter:'II · The servants',depth:23,mood:'bone',fragment:'oath',set:{oath:true},text:'A coronation oath, pressed between unpaid bills.\n<em>What is borrowed in my name, my own heart shall repay.</em>\nBelow it, a drawing of a crown laid over a chest.',choices:[C('Remember the words.','seamroom')]},
 seamroom:{title:'The sewing room.',chapter:'II · The servants',depth:24,mood:'silk',effect:'spider',text:s=>`A spider walks across a paper pattern, following a dotted line.\n${has(s,'needle')?'The needle in your pocket leans towards the worktable.':'A silver needle is pinned to the pattern. The label reads: FOR MY APPRENTICE.'}`,choices:s=>[C('Follow the spider’s line.','pattern','It knows where the seam begins.'),...(!has(s,'needle')?[C('Take the needle. Leave the pattern.','hall','Silver needle acquired.',{add:'needle'})]:[]),C('Return to the landing.','hall')]},
 pattern:{title:'Unpick. Do not cut.',chapter:'II · The servants',depth:24,mood:'silk',fragment:'seam',set:{seam:true},text:'<em>Give its own beat somewhere to wait.<br>Then unpick the borrowed life.</em>\nThe diagram shows a needle, a heart, and a small upside-down cup.',choices:s=>[...(!has(s,'needle')?[C('Take the apprentice’s needle.','hall','Silver needle acquired.',{add:'needle'})]:[C('Fold the pattern into your pocket.','hall','You remember the stitch.')])]},
 hounds:{title:'The dogs have gills.',chapter:'II · The servants',depth:24,mood:'danger',text:'Three narrow heads rise from beneath the table.\nThe cook taps its claw. They open their mouths.',choices:s=>[C('Stand your ground.',has(s,'shield')?'shieldbreak':'end:hounds',has(s,'shield')?'Your shield will take the bite.':'Nothing stands between you and their teeth.',{...(has(s,'shield')?{remove:'shield'}:{}),danger:!has(s,'shield')}),C('Slide the whole roast under the table.','mercy','They are hungry, not loyal.')]},
 shieldbreak:{title:'One last sunrise.',chapter:'II · The servants',depth:24,mood:'bone',text:'The painted sun folds between the hound’s teeth.\nYour father’s shield is gone. You are not.',choices:[C('Retreat through the pantry.','seamroom')]},
 mercy:{title:'Good dogs.',chapter:'II · The servants',depth:24,mood:'bone',text:'The smallest one pushes its cold nose into your hand.\nIt wears a collar made from a wedding ribbon.',choices:[C('Slip into the pantry.','seamroom')]},
 ballroom:{title:'The last three notes.',chapter:'II · The court',depth:26,mood:'water',note:'No one has told the music<br>that the evening is over.',text:'The musicians are coral. Their bows keep moving.\nOne woman dances in the dry half of the room. Her crown is made of folded invitations.',choices:[C('Offer her your hand.','queen'),C('Look behind the orchestra.','capstan'),C('Cross the flooded floor.','pool','A quicker way. Something moves in it.',{danger:true})]},
 queen:{title:'“We all took a turn.”',chapter:'II · The court',depth:26,mood:'bone',fragment:'queen',set:{queen:true},text:'Her palms are scarred in the shape of a rope.\n“Forty servants. Myself. Your mother. We lowered it together.”\nShe misses a step. The music begins again.',choices:s=>[C('Ask why they lowered it.','queenwhy'),...(has(s,'needle')?[C('Unpick the music from her hem.','queenfree','Leave the needle. Free the dancer.',{remove:'needle',set:{queenFree:true}})]:[]),C('Follow the rope burns.','capstan')]},
 queenwhy:{title:'“It would not go out.”',chapter:'II · The court',depth:26,mood:'water',text:'“The tide. After the king took its name, it forgot how to leave.”\nShe glances at your chest.\n“Your mother asked for one small miracle. He sent her the bill for an ocean.”',choices:[C('Look for the lowering mechanism.','capstan'),C('Return to the landing.','hall')]},
 queenfree:{title:'A fourth note.',chapter:'II · The court',depth:26,mood:'silk',text:'The silver needle disappears into the hem. The music ends.\nThe queen laughs once. She is much younger without the crown.',choices:[C('Walk with her to the capstan.','capstan')]},
 capstan:{title:'A house on a rope.',chapter:'II · The court',depth:28,mood:'bone',fragment:'chain',set:{chain:true},text:'Nine great chains run through the floor. Eight hang loose.\nOn the capstan: <em>LOWER UNTIL THE HARBOUR FITS INSIDE.</em>',choices:[C('Read the tidekeeper’s tally.','tally'),C('Pull the release.','release','The remaining chain carries the whole castle.',{danger:true}),C('Return to the landing.','hall')]},
 tally:{title:'Eight marks.',chapter:'II · The court',depth:28,mood:'bone',fragment:'ninth',text:'Each broken chain has a date. Decades between the first ones. Days between the last.\nBeside the ninth space: <em>Not yet. Wren is still so little.</em>',choices:[C('Leave the mechanism alone.','hall'),C('Pull the release.','release','Raise what was deliberately lowered.',{danger:true})]},
 release:{title:'One tooth on the ratchet.',chapter:'The last chain',depth:28,mood:'danger',text:'The lever moves a finger’s width. Dust falls upwards.\nYou can still let go.',choices:[C('Let go.','hall'),C('Put your weight on it.','end:flood','The sea will rise with the house.',{danger:true})]},
 pool:{title:'The water has teeth.',chapter:'II · The court',depth:27,mood:'water',text:'The bottom is not a floor. It is the backs of pale eels.\nA door gleams on the far side.',choices:s=>[C('Swim across.',has(s,'shield')?'eels':'end:drowned',has(s,'shield')?'The shield can hold their jaws apart.':'A long swim through hungry things.',{...(has(s,'shield')?{remove:'shield'}:{}),danger:!has(s,'shield')}),C('Keep to the dry edge.','capstan')]},
 eels:{title:'A mouthful of tin.',chapter:'II · The court',depth:28,mood:'water',text:'The first eel bites the shield. The others bite the eel.\nYou reach the far door with empty hands and a very loud heart.',choices:[C('Push through.','capstan')]},
 nursery:{title:'The thread moves.',chapter:'II · The child',depth:31,mood:'silk',effect:'spider',note:'Not every small thing<br>is helpless.',text:'A spider drags a silver thread beneath a cradle.\nAbove it: tiny ships, tiny moons, a bell with no tongue.',choices:[C('Follow the spider.','cradle'),C('Take down the bell.','bell'),C('Read the wall beside the cot.','marks')]},
 cradle:{title:'Two growing things.',chapter:'II · The child',depth:31,mood:'silk',fragment:'child',text:'Under the cradle, pencil marks measure a child’s height.\nBeside them, another set measures a rising sea. The dates are the same.',choices:[C('Read the wall.','marks'),C('Lift down the bell.','bell')]},
 bell:{title:'The sound of no sound.',chapter:'II · The child',depth:31,mood:'silk',fragment:'bell',add:'bell',text:'A label inside: <em>For his first laugh. Turn over to hear.</em>\nYou tip it. Someone laughs — a young man, then a baby.\nNow the bell is empty.',choices:[C('Put it in your pocket. Read the wall.','marks')]},
 marks:{title:'I O N A',chapter:'II · The child',depth:32,mood:'heart',text:'Four letters are stitched above the cot.\nWhen you say them, your pulse misses a beat. Water on the far side of the wall knocks once.',choices:[C('Open the birth record.','birth'),C('Leave the name alone.','nurseryexit')]},
 birth:{title:'A borrowed beginning.',chapter:'II · The child',depth:32,mood:'heart',fragment:'origin',set:{origin:true},text:'<em>Born without breath.<br>Name of the sea sewn beneath the breastbone.<br>Child answered. Sea did not.</em>\nThe mother’s signature is a small drawing of a wren.',choices:s=>[...(!has(s,'bell')?[C('Take the bell before you leave.','bellafter')]:[]),C('Return to the landing.','hall')]},
 nurseryexit:{title:'Your old blanket.',chapter:'II · The child',depth:31,mood:'silk',text:'Folded at the foot of the cot. Still small enough to fit in two hands.\nYou remember it being larger.',choices:s=>[...(!has(s,'bell')?[C('Take the bell before you leave.','bellafter')]:[]),C('Return to the landing.','hall')]},
 bellafter:{title:'A place for a sound.',chapter:'II · The child',depth:31,mood:'silk',fragment:'bell',add:'bell',text:'<em>Hold a sound inside. Turn over to return it.</em>\nYou keep the little bell upright in your pocket.',choices:[C('Return to the landing.','hall')]},
 stair:{title:'Someone is mending.',chapter:'III · The living stitch',depth:49,mood:'silk',note:'Love can hold a door shut<br>for a very long time.',text:'The stair ends at a woman seated inside a doorway.\nHer fingers move. There is no needle. The thread comes from her wrists.',choices:[C('Say “Mother.”','mother'),C('Watch what she is sewing.','watch'),C('Take the stairs back to the surface.','leaving')]},
 watch:{title:'The seam goes through her.',chapter:'III · The living stitch',depth:49,mood:'silk',fragment:'mother',set:{mother:true},text:'Every doorframe in the castle is sewn to this one. Every thread passes through her skin.\nShe is holding her breath for an entire house.',choices:[C('Take her hand.','mother')]},
 mother:{title:'“You’ve grown.”',chapter:'III · The living stitch',depth:49,mood:'heart',fragment:'mother',set:{mother:true},text:'She says it as if you have been upstairs for an hour.\nThen she presses a palm against your chest.\n“Oh, wren. It knows you’re here.”',choices:[C('Ask what you are carrying.','truth'),C('Find a way to take her home.','rescue'),C('Ask about the king.','throne')]},
 truth:{title:'“I only asked him once.”',chapter:'III · The living stitch',depth:49,mood:'heart',fragment:'origin',set:{origin:true},text:'“You were so still. He had a name that could make anything move.”\nBehind her, the sea presses its face against the veil. It has no eyes. It knows where your heart is.',choices:[C('Go to the sea.','heart'),C('Look for another way.','rescue'),C('Find the man who lent it.','throne')]},
 rescue:{title:'What a seam can bear.',chapter:'III · The living stitch',depth:49,mood:'silk',text:'Your mother smiles at your pockets.\n“Always bringing things home.”\nFor the first time, she lets you see how tired she is.',choices:s=>[...(has(s,'needle')?[C('Pin the seam. Lift her free.','pin','Leave the needle in her place.',{item:true})]:[]),...(has(s,'bell')?[C('Keep her voice in the bell.','voice','A small part of her can come with you.',{item:true})]:[]),C('Offer to take her place.','offer'),C('Ask to see the sea.','heart')]},
 pin:{title:'Silver is not forever.',chapter:'The living stitch',depth:49,mood:'silk',text:'“It will hold,” she says. Then, after a moment: “For a while.”\nHer hand is already in yours.',choices:[C('A while is enough.','end:mother','Bring her home. Leave the sea waiting.',{remove:'needle'}),C('There must be another way.','heart')]},
 voice:{title:'“What should I say?”',chapter:'The living stitch',depth:49,mood:'silk',text:'You hold the bell beneath her mouth.\nShe begins with the story she used to tell when it rained. She remembers every word.',choices:[C('Carry her story home.','end:voice'),C('Stay. Bring all of her.','heart')]},
 offer:{title:'She shakes her head.',chapter:'The living stitch',depth:49,mood:'heart',text:'You take the thread anyway. For one moment, she is just a woman in a doorway.\nYou could still put it down.',choices:[C('Keep the thread.','end:keeper','She goes free. You stay.'),C('Put it down.','heart')]},
 throne:{title:'A crown above a hollow.',chapter:'III · The borrower',depth:54,mood:'bone',note:'Some promises outlive<br>the mouths that made them.',text:s=>`The king is dry bone beneath a wet robe. His ribs are empty.\n${flag(s,'oath')?'The words of his coronation oath return to you.':'A gold plate is screwed to the foot of his throne.'}`,choices:s=>[...(!flag(s,'oath')?[C('Read the gold plate.','throneoath')]:[C('Set the crown over his heart.','debt','Call in the king’s promise.')]),C('Turn towards the water.','heart'),C('Take the stair home.','leaving')]},
 throneoath:{title:'The same old promise.',chapter:'III · The borrower',depth:54,mood:'bone',fragment:'oath',set:{oath:true},text:'<em>What is borrowed in my name, my own heart shall repay.</em>\nBelow the words, the gold is polished where someone has touched it again and again.',choices:[C('Lay the crown inside his ribs.','debt'),C('Leave him. Go to the water.','heart')]},
 debt:{title:'Gold can learn to beat.',chapter:'The borrower',depth:54,mood:'heart',text:'When you speak the oath, one rib moves.\nThe threads in the doorway lean towards the throne. Your mother begins to stand.',choices:[C('Finish the oath.','end:king'),C('No more things sewn shut.','heart')]},
 heart:{title:'The sea without a name.',chapter:'IV · The unravelling',depth:60,mood:'heart',note:'Something in the dark<br>has been answering you.',fragment:'rule',text:s=>`Beyond the veil, an ocean folds itself into the shape of a room.\nIt touches the glass where your heart would be.${has(s,'bell')&&has(s,'needle')&&flag(s,'seam')&&flag(s,'origin')?'\nIn your pocket, the empty bell trembles. You remember the pattern.':''}`,choices:s=>[...(has(s,'bell')&&has(s,'needle')&&flag(s,'seam')&&flag(s,'origin')?[C('Give your heartbeat somewhere to wait.','unpick','The bell. The needle. The unpicking stitch.',{item:true})]:[]),C('Give the sea its name back.','returnname','It is sewn into your heart.'),C('Keep your life. Find another way.','lastways'),C('Break the last anchor chain.','lastchain','Let the castle and the sea rise.',{danger:true})]},
 unpick:{title:'Your own small sound.',chapter:'The unravelling',depth:60,mood:'silk',text:'You breathe into the bell until it holds your pulse.\nThe needle catches a silver I beneath your skin. Behind it: an O. An N. An A.\nYour mother’s hands steady yours.',choices:[C('Pull the last stitch.','end:dawn','Let the sea go. Turn the bell over.',{remove:['needle','bell']}),C('Stop. You are afraid.','lastways')]},
 returnname:{title:'“It may take all of you.”',chapter:'The unravelling',depth:60,mood:'heart',text:'Your mother closes her eyes.\nThe sea waits. For once, it does not press against the veil.',choices:[C('Say “Iona.” Give it back.','end:tide','Your borrowed heartbeat will stop.',{danger:true}),C('Keep looking.','lastways')]},
 lastways:{title:'The things you can save.',chapter:'IV · The unravelling',depth:60,mood:'silk',text:'The last chain groans. Your mother keeps sewing.\nThere is still time to choose.',choices:[C('Return to Mother.','rescue'),C('Make the king answer for this.','throne'),C('Face the sea again.','heart'),C('Leave by the east stair.','leaving')]},
 lastchain:{title:'The old harbour.',chapter:'The last chain',depth:60,mood:'danger',text:'Through a crack in the wall, you see the roots of the wheat.\nThey are wrapped around old mooring posts.',choices:[C('Break the chain.','end:flood','The fields will become sea.',{danger:true}),C('Let it hold.','heart')]},
 leaving:{title:'The stair is still there.',chapter:'The east stair',depth:18,mood:'water',text:'Air from the field smells of rain. Behind you, someone hums through a mouthful of thread.\nYou do not have to be the one who fixes this.',choices:[C('Climb.','end:shore'),C('Turn back.','mother')]}
};

function freshState(){return{version:1,node:'well',items:[],flags:{letter:true},seen:[],steps:0};}
function clone(s){return JSON.parse(JSON.stringify(s));}
function apply(s,change){if(!change)return;for(const id of [].concat(change.remove||[]))s.items=s.items.filter(x=>x!==id);for(const id of [].concat(change.add||[]))if(!s.items.includes(id))s.items.push(id);Object.assign(s.flags,change.set||{});}
function enter(s,id){s.node=id;if(id.startsWith('end:'))return s;const scene=SCENES[id];if(!scene)throw Error('Missing scene: '+id);apply(s,scene);if(scene.fragment&&!s.seen.includes(scene.fragment))s.seen.push(scene.fragment);return s;}
function options(s){if(s.node.startsWith('end:'))return[];const c=SCENES[s.node].choices;return typeof c==='function'?c(s):c;}
function advance(s,i){const next=clone(s),opt=options(next)[i];if(!opt)return next;apply(next,opt);next.steps++;return enter(next,opt.to);}
const STORAGE='the-ninth-tide.v1';
let book={endings:[],fragments:[],runs:0},run=null,screen='cover',locked=false,soundOn=false,motionOn=!matchMedia('(prefers-reduced-motion: reduce)').matches,storageOK=true,lastFocus=null,journalTab='fragments';
const $=id=>document.getElementById(id);
try{const data=JSON.parse(localStorage.getItem(STORAGE)||'null');if(data){if(data.book){book.endings=[...new Set((data.book.endings||[]).filter(x=>ENDINGS[x]))];book.fragments=[...new Set((data.book.fragments||[]).filter(x=>FRAGMENTS[x]))];book.runs=Number(data.book.runs)||0;}if(data.run&&data.run.version===1&&(SCENES[data.run.node]||ENDINGS[String(data.run.node).replace('end:','')])&&Array.isArray(data.run.items)&&data.run.flags&&Array.isArray(data.run.seen)){run=data.run;run.items=run.items.filter(x=>ITEMS[x]);run.seen=run.seen.filter(x=>FRAGMENTS[x]);}if(typeof data.motionOn==='boolean')motionOn=data.motionOn;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({run,book,motionOn}));storageOK=true;}catch(e){storageOK=false;}$('saveStatus').textContent=storageOK?(screen==='cover'?'NO HURRY. THE SEA CAN WAIT.':'YOUR DESCENT IS SAVED.'):'SAVING UNAVAILABLE · KEEP THIS TAB OPEN';}
function textBlocks(text){return text.split('\n').map(p=>'<p>'+p+'</p>').join('');}
function icon(id){return'<svg viewBox="0 0 20 20" aria-hidden="true">'+ITEMS[id].icon+'</svg>';}
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),4000);}
function updateBook(){if(!run)return;for(const id of run.seen)if(!book.fragments.includes(id))book.fragments.push(id);if(run.node.startsWith('end:')){const id=run.node.slice(4);if(!book.endings.includes(id)){book.endings.push(id);toast('A new ending has been added to your field notes.');}}}
function footer(){$('noteCount').textContent=String(book.fragments.length).padStart(2,'0');$('endingProgress').innerHTML=Object.keys(ENDINGS).map(id=>'<span class="pip '+(book.endings.includes(id)?'found':'')+'" aria-hidden="true"></span>').join('')+'<span style="margin-left:5px">'+book.endings.length+' / 10 ENDINGS</span>';$('endingProgress').setAttribute('aria-label',book.endings.length+' of 10 endings discovered');}
function directions(n){return n===1?['up']:n===2?['up','down']:n===3?['up','right','down']:['up','right','down','left'];}
const ARROWS={up:'↑',right:'→',down:'↓',left:'←'};
function setAtmosphere(mood,depth,note){document.body.dataset.mood=mood;$('depthLabel').textContent=depth?String(depth).padStart(2,'0')+' FATHOMS BELOW':'ABOVE THE WATERLINE';$('plateMark').textContent=String(depth).padStart(2,'0')+' : 09';$('depthRail').style.setProperty('--depth',Math.min(depth/60*100,100)+'%');$('artNote').innerHTML=note||'The house is listening.<br>Take your time.';let html='';if(mood==='water')for(let i=0;i<9;i++)html+='<i class="drop" style="left:'+(5+i*11.4)+'%;animation-delay:'+(-i*1.31)+'s;animation-duration:'+(5+i%4)+'s"></i>';for(let i=0;i<12;i++)html+='<i class="mote" style="left:'+(8+i*7.6)+'%;top:'+(25+(i*17)%65)+'%;animation-delay:'+(-i*2.6)+'s"></i>';$('ambient').innerHTML=html;if(audioEngine)audioEngine.mood(mood);}
function renderCover(){screen='cover';document.body.classList.add('cover');setAtmosphere('water',0,'Some things sink.<br>Some things are lowered.');const canContinue=run&&!run.node.startsWith('end:');$('content').innerHTML='<div class="scene-card enter"><div class="eyebrow">A short descent. A long echo.</div><h1>The Ninth<br><em>Tide.</em></h1><p class="intro-copy">The sea has returned your mother’s letter.<br>She has been dead for seventeen years.</p><button class="start-btn" id="begin">'+(canContinue?'Continue the descent':'Enter the well')+'<span class="arrow">↗</span></button><p class="start-meta">10 ENDINGS · 3 SMALL OBJECTS · A CASTLE FULL OF SECRETS<br>ABOUT 10 MINUTES PER DESCENT</p><div class="continue-row">'+(canContinue?'<button class="text-link" id="newRun">Begin again</button>':'')+'<button class="text-link" id="coverArchive">'+(book.endings.length?'Read your field notes':'How to play')+'</button></div></div>';$('begin').onclick=()=>canContinue?resume():start();if($('newRun'))$('newRun').onclick=confirmRestart;$('coverArchive').onclick=()=>book.endings.length?openJournal():openHelp();footer();save();}
function start(){book.runs++;run=enter(freshState(),'well');screen='play';closeDialog();render();}
function resume(){screen='play';render();}
function render(){if(!run)return renderCover();document.body.classList.remove('cover');updateBook();footer();if(run.node.startsWith('end:')){renderEnding(run.node.slice(4));save();return;}screen='play';const scene=SCENES[run.node],opts=options(run),dirs=directions(opts.length);setAtmosphere(scene.mood,scene.depth,scene.note);const text=typeof scene.text==='function'?scene.text(run):scene.text;$('content').innerHTML='<div class="scene-card enter" id="sceneCard"><div class="eyebrow">'+scene.chapter+'</div><h2 class="scene-title" id="sceneTitle" tabindex="-1">'+scene.title+'</h2><div class="scene-copy">'+textBlocks(text)+'</div><div class="choices" aria-label="What will you do?">'+opts.map((o,i)=>'<button class="choice '+(o.danger?'danger ':'')+(o.item?'item':'')+'" data-choice="'+i+'" aria-label="'+(i+1)+'. '+o.label+' '+(o.note||'')+'"><span class="key" aria-hidden="true">'+ARROWS[dirs[i]]+'</span><span class="choice-body"><span class="choice-title">'+o.label+'</span>'+(o.note?'<span class="choice-note">'+o.note+'</span>':'')+'</span><span class="choice-number" aria-hidden="true">0'+(i+1)+'</span></button>').join('')+'</div><div class="inventory"><span class="pocket-label">WITH YOU</span>'+(run.items.length?run.items.map(id=>'<button class="item-chip" data-item="'+id+'" aria-label="Inspect '+ITEMS[id].name+'">'+icon(id)+ITEMS[id].name+'</button>').join(''):'<span class="empty-pocket">Just your own two hands.</span>')+'</div><div class="gesture" id="gesture" aria-label="Swipe here in a direction shown beside a choice">SWIPE HERE TO CHOOSE · OR TAP AN OPTION</div></div>';document.querySelectorAll('[data-choice]').forEach(bindChoice);document.querySelectorAll('[data-item]').forEach(el=>el.onclick=()=>inspect(el.dataset.item));bindGesture();save();if(scene.effect==='spider'&&motionOn){$('spider').classList.remove('run');void $('spider').offsetWidth;$('spider').classList.add('run');}}
function bindChoice(el){let down=null,lastTouch=-1000;const sceneId=run.node,activate=()=>{if(run.node===sceneId)choose(Number(el.dataset.choice));};el.onpointerdown=e=>{if(e.pointerType==='touch')down={x:e.clientX,y:e.clientY};};el.onpointercancel=()=>{down=null;};el.onpointerup=e=>{if(e.pointerType!=='touch')return;lastTouch=performance.now();e.preventDefault();if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<14)activate();down=null;};el.onclick=e=>{if(e.detail>0&&performance.now()-lastTouch<700)return;activate();};}
function choose(i){if(locked||screen!=='play'||$('modal').open||!options(run)[i])return;locked=true;const oldItems=[...run.items],oldSeen=[...book.fragments];if(audioEngine)audioEngine.chime();const card=$('sceneCard');if(card)card.classList.add('exit');setTimeout(()=>{run=advance(run,i);render();const gains=run.items.filter(x=>!oldItems.includes(x));const losses=oldItems.filter(x=>!run.items.includes(x));if(gains.length)toast(gains.map(x=>ITEMS[x].name).join(' + ')+' added to your pockets.');else if(losses.length&&!run.node.startsWith('end:'))toast(losses.map(x=>ITEMS[x].name).join(' + ')+' left behind.');else if(!run.node.startsWith('end:')&&book.fragments.length>oldSeen.length)toast('A detail remembered. Open your field notes with J.');const heading=$('sceneTitle');if(heading)heading.focus({preventScroll:true});if(innerWidth<701)$('content').scrollIntoView({block:'start',behavior:'instant'});locked=false;},motionOn?170:0);}
function renderEnding(id){screen='ending';const e=ENDINGS[id];setAtmosphere(e.mood,id==='dawn'||id==='mother'||id==='shore'||id==='voice'?0:60,e.epitaph);$('content').innerHTML='<div class="scene-card enter"><div class="eyebrow">The descent is over</div><h2 class="scene-title" id="sceneTitle" tabindex="-1">'+e.title+'</h2><div class="ending-mark">ENDING '+String(e.n).padStart(2,'0')+' / 10</div><div class="ending-copy">'+textBlocks(e.text.join('\n'))+'</div><p class="ending-foot">'+e.epitaph+'</p><div class="ending-actions"><button class="start-btn" id="again">Descend again<span class="arrow">↗</span></button><button class="text-link" id="readEnding">Read what remains</button></div><p class="return-hint">'+book.endings.length+' of 10 endings found. Your field notes survive every descent.</p></div>';$('again').onclick=start;$('readEnding').onclick=()=>openJournal('endings');}
function openDialog(title,html){lastFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function closeDialog(){if($('modal').open)$('modal').close();}
function inspect(id){openDialog(ITEMS[id].name,'<p>'+ITEMS[id].desc+'</p><p>When this object can change a choice, the story will offer that choice. Your shield catches the first bite when you choose to face one.</p>');}
function openJournal(tab=journalTab){journalTab=tab;const tabs='<div class="tabs" role="group" aria-label="Field note sections"><button class="tab '+(tab==='fragments'?'active':'')+'" id="fragmentsTab">DETAILS · '+book.fragments.length+'/12</button><button class="tab '+(tab==='endings'?'active':'')+'" id="endingsTab">ENDINGS · '+book.endings.length+'/10</button></div>';let html=tabs;if(tab==='fragments'){html+='<p style="margin-bottom:19px">Details from all your descents. No single journey tells the whole story.</p>';html+=Object.entries(FRAGMENTS).map(([id,f],i)=>book.fragments.includes(id)?'<article class="journal-entry"><div class="entry-meta">FRAGMENT '+String(i+1).padStart(2,'0')+'</div><h3>'+f.title+'</h3><p>'+f.text+'</p></article>':'<div class="locked">'+String(i+1).padStart(2,'0')+' &nbsp; A detail still below the surface.</div>').join('');}else{html+=Object.entries(ENDINGS).map(([id,e])=>book.endings.includes(id)?'<article class="journal-entry"><div class="entry-meta">ENDING '+String(e.n).padStart(2,'0')+'</div><h3>'+e.title+'</h3><p>'+e.reveal+'</p></article>':'<div class="locked">'+String(e.n).padStart(2,'0')+' &nbsp; A shore you have not reached.</div>').join('');}openDialog('What the water keeps',html);$('fragmentsTab').onclick=()=>openJournal('fragments');$('endingsTab').onclick=()=>openJournal('endings');}
function openHelp(){openDialog('A few things before you go','<p>Choose by clicking a line, pressing its arrow key, or pressing <strong>1–4</strong>. W / D / S / A work like the arrows. On a phone, swipe the marked strip beneath your pockets.</p><p>There is no timer. Read the small hints: danger is usually announced, and a choice can cost an object. Items are used through story choices. Click an item to inspect it.</p><p>Press <strong>J</strong> for field notes, <strong>M</strong> for sound, and <strong>Esc</strong> to close a panel. Tab and Enter also work. Your descent and discoveries save in this browser when storage is available.</p><p>Different routes reveal different details. Replaying keeps your notes and ending discoveries; your choices and objects begin fresh.</p><div class="modal-actions"><button class="small-btn secondary" id="motionToggle">Motion: '+(motionOn?'on':'reduced')+'</button>'+(run?'<button class="small-btn secondary" id="restartHelp">Begin a new descent</button>':'')+'</div>');$('motionToggle').onclick=()=>{motionOn=!motionOn;document.body.classList.toggle('motion-off',!motionOn);save();openHelp();};if($('restartHelp'))$('restartHelp').onclick=confirmRestart;}
function confirmRestart(){openDialog('Begin again?','<p>Your current descent will end. Discovered details and endings will stay in your field notes.</p><div class="modal-actions"><button class="small-btn" id="restartYes">Begin a new descent</button><button class="small-btn secondary" id="restartNo">Keep exploring</button></div>');$('restartYes').onclick=start;$('restartNo').onclick=closeDialog;}
function bindGesture(){const pad=$('gesture');if(!pad)return;let p=null;pad.addEventListener('pointerdown',e=>{p={x:e.clientX,y:e.clientY,id:e.pointerId};pad.setPointerCapture(e.pointerId);});pad.addEventListener('pointerup',e=>{if(!p||p.id!==e.pointerId)return;const x=e.clientX-p.x,y=e.clientY-p.y;p=null;if(Math.max(Math.abs(x),Math.abs(y))<35)return;const dir=Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');const i=directions(options(run).length).indexOf(dir);if(i>=0)choose(i);else toast('Use a direction shown beside one of the choices.');});pad.addEventListener('pointercancel',()=>p=null);}
// Optional, quiet generative ambience. Audio starts only after an explicit click.
let audioEngine=null;
function createAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio is unavailable');const ctx=new AC(),master=ctx.createGain(),low=ctx.createBiquadFilter();master.gain.value=0;master.connect(ctx.destination);low.type='lowpass';low.frequency.value=340;low.connect(master);const buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate),data=buffer.getChannelData(0);let brown=0;for(let i=0;i<data.length;i++){brown=(brown+(Math.random()*2-1)*.025)/1.025;data[i]=brown*2.2;}const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;noise.connect(low);noise.start();const drone=ctx.createOscillator(),dg=ctx.createGain();drone.type='sine';drone.frequency.value=55;dg.gain.value=.055;drone.connect(dg);dg.connect(master);drone.start();return{ctx,master,on(value){ctx.resume();master.gain.setTargetAtTime(value?.27:0,ctx.currentTime,.7);},mood(mood){low.frequency.setTargetAtTime(mood==='water'?620:mood==='heart'?180:320,ctx.currentTime,1.5);drone.frequency.setTargetAtTime(mood==='heart'?51.9:mood==='dawn'?65.4:55,ctx.currentTime,2);},chime(){if(!soundOn)return;const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.type='sine';o.frequency.value=[220,261.63,293.66,329.63][Math.floor(Math.random()*4)];g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.09,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+1.3);o.connect(g);g.connect(master);o.start();o.stop(now+1.4);}};}
async function toggleSound(){try{if(!audioEngine)audioEngine=createAudio();soundOn=!soundOn;audioEngine.on(soundOn);$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'Mute ambient sound':'Enable ambient sound');$('soundLabel').textContent=soundOn?'Sound on':'Sound off';$('soundSlash').style.display=soundOn?'none':'';}catch(e){toast('Ambient audio is unavailable in this browser.');}}
$('sound').onclick=toggleSound;$('journal').onclick=()=>openJournal();$('help').onclick=openHelp;$('home').onclick=()=>{if(!locked)renderCover();};$('closeModal').onclick=closeDialog;$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});$('modal').addEventListener('close',()=>{if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const key=e.key.toLowerCase();if(key==='escape'){closeDialog();return;}if($('modal').open)return;if(key==='j'){e.preventDefault();openJournal();return;}if(key==='m'){e.preventDefault();toggleSound();return;}if(screen==='cover'&&e.key==='Enter'&&!(document.activeElement instanceof HTMLButtonElement)){e.preventDefault();run&&!run.node.startsWith('end:')?resume():start();return;}if(screen!=='play')return;const map={arrowup:'up',w:'up',arrowright:'right',d:'right',arrowdown:'down',s:'down',arrowleft:'left',a:'left'};let i=-1;if(map[key]){e.preventDefault();i=directions(options(run).length).indexOf(map[key]);}else if(/^[1-4]$/.test(key)){e.preventDefault();i=Number(key)-1;}if(i>=0)choose(i);});
document.addEventListener('visibilitychange',()=>{if(audioEngine)audioEngine.on(soundOn&&!document.hidden);});
document.body.classList.toggle('motion-off',!motionOn);renderCover();
</script>
