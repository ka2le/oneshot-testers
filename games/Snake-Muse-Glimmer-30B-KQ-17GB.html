<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Desert Snake</title>
<style>
  :root{
    --sand1:#f4d7a0;
    --sand2:#e8b87a;
    --sand3:#d9a65b;
    --cactus:#3cb043;
    --snake:#c97a3d;
    --snakeHead:#e09a4a;
    --food:#d64545;
    --gold:#ffd166;
    --water:#4db8ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(ellipse at top,#fff3d6,#f4d7a0 60%,#e8b87a);
    font-family: 'Courier New', monospace;
    display:flex;align-items:center;justify-content:center;
    color:#5a3a1a;
  }
  .wrap{
    background: linear-gradient(to bottom,var(--sand1),var(--sand2));
    padding:20px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.25), inset 0 0 0 6px #fff2;
    text-align:center;
  }
  h1{margin:0 0 10px;font-size:28px;letter-spacing:2px;text-shadow:0 2px 0 #fff}
  canvas{
    background: repeating-linear-gradient(45deg,var(--sand1) 0 20px,var(--sand2) 20px 40px);
    border-radius:12px;
    box-shadow:inset 0 0 30px rgba(0,0,0,.15);
    display:block;
  }
  .ui{
    display:flex;justify-content:space-between;align-items:center;
    margin:10px 0 6px;font-weight:bold;
  }
  .bar{
    width:180px;height:10px;background:#fff6;border-radius:6px;overflow:hidden;
    display:inline-block;vertical-align:middle;margin-left:8px;
  }
  .bar > i{display:block;height:100%;background:var(--water);width:100%;transition:.2s}
  button{
    background:#5a3a1a;color:#fff;border:none;padding:10px 18px;
    border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;
    box-shadow:0 4px 0 #3a2410;
  }
  button:active{transform:translateY(2px);box-shadow:0 2px 0 #3a2410}
  .hint{opacity:.8;font-size:13px;margin-top:6px}
  .sandstorm{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background: repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px);
    transition:opacity .5s;
  }
  .sandstorm.on{opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌵 Desert Snake 🐍</h1>
  <div class="ui">
    <div>Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
    <div>Hydration <div class="bar"><i id="hydBar"></i></div></div>
  </div>
  <canvas id="game" width="600" height="600"></canvas>
  <div class="sandstorm" id="storm"></div>
  <button id="restart">Restart [R]</button>
  <div class="hint">W A S D to move • Eat dates, avoid cactus & walls • Water drops prevent dehydration • Golden date = boost</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELL = canvas.width / GRID;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const hydBar = document.getElementById('hydBar');
  const stormEl = document.getElementById('storm');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, cactus, score, best, dehydration, gameOver, sandstorm, sandTimer;
  let speed = 140, baseSpeed = 140, boostTimer = 0, moveCount = 0;

  const rand = (m,n)=> Math.floor(Math.random()*(n-m+1))+m;
  const inside = p => p.x>=0 && p.x<GRID && p.y>=0 && p.y<GRID;
  const equal = (a,b)=> a.x===b.x && a.y===b.y;

  function init(){
    best = +localStorage.getItem('desertSnakeBest') || 0;
    bestEl.textContent = best;
    reset();
  }

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {...dir};
    score = 0; dehydration = 100; gameOver = false; sandstorm = false;
    boostTimer = 0; moveCount = 0; speed = baseSpeed;
    cactus = [];
    for(let i=0;i<10;i++){
      let p; do{ p={x:rand(2,GRID-3), y:rand(2,GRID-3)} }while(snake.some(s=>equal(s,p))||cactus.some(c=>equal(c,p)));
      cactus.push(p);
    }
    spawnFood();
    loop();
  }

  function spawnFood(){
    let p; do{
      p={x:rand(0,GRID-1), y:rand(0,GRID-1)};
    }while(snake.some(s=>equal(s,p))||cactus.some(c=>equal(c,p)));
    const r = Math.random();
    if(r<0.12) food = {p, type:'gold'};
    else if(r<0.28) food = {p, type:'water'};
    else food = {p, type:'date'};
  }

  function loop(){
    if(gameOver) return draw();
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    // move direction
    dir = {...nextDir};

    // wall / self / cactus collision
    if(!inside(head) || snake.some((s,i)=>i>0 && equal(s,head)) || cactus.some(c=>equal(c,head))){
      return endGame();
    }

    snake.unshift(head);
    let ate = equal(head, food.p);
    if(ate){
      if(food.type==='date'){ score += 10; }
      if(food.type==='gold'){ score += 50; boostTimer = 30; speed = baseSpeed*0.6; }
      if(food.type==='water'){ dehydration = 100; score += 20; }
      spawnFood();
    }else{
      snake.pop();
    }

    // dehydration
    dehydration -= 1.5;
    if(dehydration <= 0){
      if(snake.length>4){ snake.pop(); score = Math.max(0,score-5); }
      dehydration = 100;
    }

    moveCount++;
    if(boostTimer>0){ boostTimer--; if(boostTimer===0) speed = baseSpeed; }

    draw();
    setTimeout(loop, speed);
  }

  function endGame(){
    gameOver = true;
    if(score>best){ best=score; localStorage.setItem('desertSnakeBest',best); bestEl.textContent=best; }
    scoreEl.textContent = score;
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // dunes
    for(let i=0;i<GRID;i++){
      for(let j=0;j<GRID;j++){
        ctx.fillStyle = (i+j)%2 ? '#f0d8a8' : '#e8c08a';
        ctx.fillRect(i*CELL,j*CELL,CELL,CELL);
      }
    }
    // cactus
    ctx.fillStyle = '#3cb043';
    cactus.forEach(c=>{
      ctx.fillRect(c.x*CELL+4,c.y*CELL+4,CELL-8,CELL-8);
      ctx.fillRect(c.x*CELL+2,c.y*CELL+2,6,8);
    });

    // snake
    snake.forEach((s,i)=>{
      const x=s.x*CELL, y=s.y*CELL;
      ctx.fillStyle = i===0 ? '#e09a4a' : '#c97a3d';
      ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=1; ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    });

    // food
    const f = food.p;
    if(food.type==='date'){ ctx.fillStyle = '#d64545'; }
    if(food.type==='gold'){ ctx.fillStyle = '#ffd166'; }
    if(food.type==='water'){ ctx.fillStyle = '#4db8ff'; }
    ctx.beginPath();
    ctx.arc(f.x*CELL+CELL/2, f.y*CELL+CELL/2, CELL*0.35,0,Math.PI*2);
    ctx.fill();

    // UI
    scoreEl.textContent = score;
    hydBar.style.width = Math.max(0,dehydration)+'%';

    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.fillRect(0,canvas.height/2-60,canvas.width,120);
      ctx.fillStyle='#fff'; ctx.font='32px monospace'; ctx.textAlign='center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
      ctx.font='18px monospace';
      ctx.fillText('Press Restart or R', canvas.width/2, canvas.height/2+30);
    }
  }

  // input
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','w'].includes(k) && dir.y!==1){ nextDir={x:0,y:-1}; }
    else if(['arrowdown','s'].includes(k) && dir.y!==-1){ nextDir={x:0,y:1}; }
    else if(['arrowleft','a'].includes(k) && dir.x!==1){ nextDir={x:-1,y:0}; }
    else if(['arrowright','d'].includes(k) && dir.x!==-1){ nextDir={x:1,y:0}; }
    if(k==='r') reset();
  });

  restartBtn.onclick = reset;

  // sandstorm twist
  setInterval(()=>{
    sandstorm = true; stormEl.classList.add('on'); speed = baseSpeed*0.85;
    setTimeout(()=>{ sandstorm=false; stormEl.classList.remove('on'); if(boostTimer===0) speed=baseSpeed; }, 7000);
  }, 45000);

  init();
})();
</script>
</body>
</html>
