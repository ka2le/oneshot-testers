<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f0b">

<style>
:root{--bg:#120f0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color-scheme:dark}

:root[data-theme="dark"]{--bg:#120f0b}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Pinball table. Touch the left half for the left flipper, the right half for the right flipper. Hold anywhere to charge a launch."></canvas>
<script>(()=>{'use strict';
/* ================= constants ================= */
const W=400,OY=72,FH=800,H=OY+FH;
const R=8.5,GRAV=880,MAXV=1700,FL=58,SUB=12,TAU=Math.PI*2;
const GOLD='255,205,120',WARM='255,165,70',LAPIS='95,145,235',TEAL='60,210,190',STARC='150,185,235';
const COL={L:'#6b3fa0',C:'#a67a08',O:'#b23a22',W:'#2e7a45',T:'#11796d',H:'#a8325e',bump:'#c0601a',star:'#3f5f8f',lane:'#9a7020',drop:'#2f5da8',gold:'#a8780f'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bgC=document.createElement('canvas'),topC=document.createElement('canvas');
let cw=1,ch=1,dpr=1,S=1,ox=0,oy=0,rect={left:0,top:0},T=0;

const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const nrm=(x,y)=>{const l=Math.hypot(x,y);return{x:x/l,y:y/l};};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ================= geometry ================= */
const segs=[],circs=[];
function seg(ax,ay,bx,by,o){const s=Object.assign({ax,ay,bx,by,r:1.5,e:0.42,kind:'wall',on:true,draw:true,hit:0,cd:0,ow:null},o||{});segs.push(s);return s;}
function circ(x,y,r,o){const c=Object.assign({x,y,r,e:0.4,kind:'post',hit:0,cd:0},o||{});circs.push(c);return c;}
function arcSegs(cx,cy,rad,a0,a1,n,o){for(let i=0;i<n;i++){const p=a0+(a1-a0)*i/n,q=a0+(a1-a0)*(i+1)/n;
  seg(cx+rad*Math.cos(p),cy+rad*Math.sin(p),cx+rad*Math.cos(q),cy+rad*Math.sin(q),o);}}

// outer shell
seg(20,800,20,200,{draw:false,e:.35});
arcSegs(200,200,180,Math.PI,TAU,48,{draw:false,e:.1,r:.5});
seg(380,200,380,800,{draw:false,e:.3});
seg(352,800,352,250,{r:2});                                   // plunger lane wall
seg(352,772,380,772,{draw:false,e:.05});                      // plunger plate
const flap=seg(380,222,352,250,{r:2,ow:nrm(-28,-28),e:.2,draw:false,kind:'flap'}); // one-way: launch passes, falling balls roll into the right orbit
// orbit inner wall (top lanes cut through it)
const thA=x=>TAU-Math.acos((x-200)/152),thAy=x=>200-Math.sqrt(152*152-(x-200)**2);
arcSegs(200,200,152,Math.PI,thA(155),14,{r:2});
arcSegs(200,200,152,thA(245),thA(318),10,{r:2});
// Flared left orbit: an actual diagonal entrance, clear of the tomb below.
seg(48,200,48,278,{r:2}); seg(48,278,60,310,{r:2}); seg(60,310,86,334,{r:2});
seg(20,300,28,330,{r:2}); seg(28,330,50,354,{r:2});
seg(318,thAy(318),318,380,{r:2});
[155,185,215,245].forEach(x=>seg(x,(x===155||x===245)?55:50,x,90,{r:2.5,e:.4}));
// sun temple bumpers + stars
const bumpers=[circ(166,132,18,{kind:'bumper'}),circ(234,132,18,{kind:'bumper'}),circ(200,182,18,{kind:'bumper'})];
const stars=[circ(108,118,12,{kind:'star'}),circ(290,120,12,{kind:'star'}),circ(128,168,12,{kind:'star'}),circ(272,168,12,{kind:'star'})];
// sanctum
const dais=circ(96,218,24,{kind:'dais',e:.35});
const gate=seg(86,342,134,318,{kind:'gate',r:2.5,e:.35,draw:false});
// spinner lane
seg(170,266,170,304,{r:2.5}); seg(210,266,210,304,{r:2.5});
// tomb: a compact, tapered pocket; the diagonal bank leaves the orbit/ramp fan open.
const TOMB={ax:76,ay:402,bx:48,by:482};
seg(76,394,76,402,{r:2.5}); seg(48,482,44,490,{r:2.5});
const tramp=seg(20,480,44,490,{kind:'tramp',r:2.5,draw:false,e:.3});
const tombTop=x=>394, tombBot=x=>480+10*(x-20)/24, tombFace=y=>76-28*clamp((y-402)/80,0,1);
const drops=[0,1,2].map(i=>{const t=(i*27+2)/80,u=(i*27+24)/80;return seg(lerp(TOMB.ax,TOMB.bx,t),lerp(TOMB.ay,TOMB.by,t),lerp(TOMB.ax,TOMB.bx,u),lerp(TOMB.ay,TOMB.by,u),{kind:'drop',r:2.5,e:.2,draw:false,i});});
const jewels=[circ(44,424,8,{kind:'jewel',e:.6}),circ(36,455,7,{kind:'jewel',e:.6})];
// solar chute: roofed intake on the right, hidden tube, exit port up in the temple
seg(352,396,328,428,{r:2,e:.3});                     // roof (also right orbit exit guide)
seg(351,506,352,506,{r:2});
const mC=(()=>{const ax=328,ay=428,bx=351,by=506,len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len;return{ax,ay,bx,by,len,ux,uy,nx:uy,ny:-ux};})();
// springs & targets
const springs=[seg(23,412,23,470,{kind:'spring',r:2,draw:false,e:.3}),seg(23,524,23,552,{kind:'spring',r:2,draw:false,e:.3}),
  seg(348,552,348,572,{kind:'spring',r:2,draw:false,e:.3})];
const scarab=seg(346,518,346,544,{kind:'scarab',r:2.5,e:.3,draw:false});
// slings & inlanes
seg(72,575,72,625,{r:2}); seg(72,625,104,640,{r:2});
const slingL=seg(72,575,104,640,{kind:'sling',r:2.5,draw:false});
seg(300,575,300,625,{r:2}); seg(300,625,268,640,{r:2});
const slingR=seg(300,575,268,640,{kind:'sling',r:2.5,draw:false});
seg(46,556,46,640,{r:2}); seg(46,640,116,677,{r:2});
seg(326,556,326,640,{r:2}); seg(326,640,256,677,{r:2});

function mouth(ax,ay,bx,by){const len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len;let nx=uy,ny=-ux;if(ny>0){nx=-nx;ny=-ny;}return{ax,ay,bx,by,len,ux,uy,nx,ny};}
const mL=mouth(86,342,134,318);
const ACX=192;
const WELL={x:262,y:300},CHUTE={x:306,y:215};
const TOPL=[170,200,230],LOWL=[33,59,313,339];
const CONST=[0,1,2,3,4,5].map(i=>{const a=-Math.PI/2+i*TAU/6;return{x:ACX+Math.cos(a)*66,y:470+Math.sin(a)*66};});
const LAMPS=[...Array(10)].map((_,i)=>{const a=Math.PI*(1.1+.8*i/9);return{x:200+Math.cos(a)*166,y:200+Math.sin(a)*166};});

const flippers=[{x:118,y:688,dir:1,a:.5,rest:.5,up:-.42,held:false},{x:254,y:688,dir:-1,a:.5,rest:.5,up:-.42,held:false}];
for(const f of flippers){f.tx=f.otx=f.x+f.dir*Math.cos(f.a)*FL;f.ty=f.oty=f.y+Math.sin(f.a)*FL;}

function mkPath(pts){const o=[],n=pts.length;
  for(let i=0;i<n-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    for(let k=0;k<12;k++){const t=k/12,t2=t*t,t3=t2*t;
      const f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
      o.push({x:f(0),y:f(1),z:clamp(f(2),0,1.1)});}}
  const l=pts[n-1];o.push({x:l[0],y:l[1],z:l[2]});
  let L=0;o[0].d=0;for(let i=1;i<o.length;i++){L+=Math.hypot(o[i].x-o[i-1].x,o[i].y-o[i-1].y);o[i].d=L;}
  return{p:o,L};}
function at(P,d){const p=P.p;if(d<=0)return p[0];if(d>=P.L)return p[p.length-1];
  let lo=0,hi=p.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(p[m].d<d)lo=m;else hi=m;}
  const a=p[lo],b=p[hi],t=(d-a.d)/((b.d-a.d)||1);return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),z:lerp(a.z,b.z,t)};}
const LRAMP=mkPath([[110,330,0],[108,300,.4],[104,270,.8],[99,242,1],[96,216,1]]);
const TUBE=mkPath([[342,465,0],[318,420,0],[312,380,0],[310,300,0],[306,215,0]]);
// Raised wireforms share the right return. They only carry completed shots;
// weak orbit attempts and target rebounds remain live on the playfield.
const RRETURN=mkPath([[335,380,.75],[336,416,1],[333,482,1],[314,550,.6],[314,596,0]]);
const LRETURN=mkPath([[64,340,.75],[38,362,1],[34,478,1],[59,550,.6],[59,596,0]]);
const LEJ=mkPath([[96,216,1],[140,237,1],[228,237,1],[287,255,1],[304,302,1],[320,345,1],[335,380,.75]]);
/* ================= game state ================= */
const balls=[],parts=[],pops=[];
const G={};
const FRESH=()=>({L:1,C:1,O:1,W:1,T:1,H:1});
function mkBall(x,y,st,hold){return{hk:'S',inT:false,orb:null,inChute:false,x,y,vx:0,vy:0,st,z:st==='play'?0:1,holdT:hold||0,d:0,ox:0,oy:0,still:0,path:null,which:'',pspd:0};}
function addLaneBall(){const b=mkBall(366,760,'play');if(G.lanes)G.skill=Math.floor(Math.random()*3);balls.push(b);return b;}
function newGame(){
  Object.assign(G,{score:0,shown:0,gain:0,gainT:0,spare:2,mult:1,lanes:[0,0,0],laneCd:[0,0,0],laneFlash:0,
    low:[0,0,0,0],lowCd:[0,0,0,0],lowFlash:0,
    gateOpen:false,gateT:0,energy:1,sand:0,sandFlow:0,goldenLit:false,golden:0,relics:0,multi:false,jackpot:false,jackAt:'O',
    combo:0,comboT:0,fresh:FRESH(),xbLit:false,xbThisBall:false,save:0,saveUsed:false,saveFlash:0,
    over:false,overT:0,charge:0,charging:false,nextXB:2500000,eyeGlow:0,flash:0,trayPulse:0,ejectQ:0,ejectT:0,spinA:0,spinV:0,
    tombHits:0,wellLevel:0,wellVisits:0,mystery:false,wellCd:0,wellGlow:0,nudges:0,
    orbitLit:0,orbitFlash:0,lampF:Array(10).fill(0),chuteLvl:0,chuteGlow:0,
    starT:Array(6).fill(0),starCd:Array(6).fill(0),starFlash:0,chain:0,chainT:0,
    kbL:true,kbR:true,kbFlashL:0,kbFlashR:0,scarabProg:0,skill:1,skillT:0,tubeT:0});
  for(const d of drops)d.on=true;gate.on=true;balls.length=0;parts.length=0;pops.length=0;addLaneBall();}
function readyBall(){if(balls.length!==1)return null;const b=balls[0];return(b.st==='play'&&b.x>353&&b.y>700)?b:null;}

/* ================= audio ================= */
let AC=null,master=null;const lastS={};
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
const arp=(fs,d,type,v,gap)=>fs.forEach((f,i)=>tone(f,d,type,v,0,i*gap));
function sfx(n,a){if(!AC)return;const now=AC.currentTime;if(lastS[n]&&now-lastS[n]<.04)return;lastS[n]=now;
  switch(n){
    case'flip':tone(92,.06,'triangle',.05,.6);break;
    case'bumper':tone(196*(1+a),.35,'sine',.06);tone(294*(1+a),.25,'sine',.025);break;
    case'star':tone(660+a*60,.18,'sine',.035);break;
    case'sling':tone(420,.08,'triangle',.035,.7);break;
    case'spring':tone(180,.12,'triangle',.045,2.2);break;
    case'wall':tone(150,.05,'sine',Math.min(.03,a/15000));break;
    case'lane':tone([523,659,784,880][a%4],.45,'sine',.045);break;
    case'roll':tone(1046*Math.pow(1.06,Math.min(a,10)),.25,'sine',.03);break;
    case'chord':arp([523,659,784,1047],.9,'sine',.035,.07);break;
    case'drop':tone(220,.12,'square',.015,.5);break;
    case'scarab':tone(330,.35,'triangle',.04,1.5);break;
    case'thud':tone(78,.15,'sine',.07);break;
    case'gate':arp([392,523,659],.7,'triangle',.03,.09);break;
    case'ramp':tone(262,.6,'sine',.035,2);break;
    case'orbit':tone(330,.7,'sine',.035,2.5);break;
    case'chute':tone(110,.5,'sawtooth',.02,4);break;
    case'spin':tone(900,.03,'square',.008);break;
    case'combo':tone(440*Math.pow(1.122,Math.min(a,12)),.35,'triangle',.04);break;
    case'lit':tone(880,.5,'sine',.03);tone(1320,.5,'sine',.02,0,.1);break;
    case'relic':arp([330,440,554,659],.8,'sine',.04,.1);break;
    case'jackpot':arp([523,659,784,1047,1319],.9,'triangle',.035,.08);break;
    case'multi':arp([262,330,392,523,659,784],1,'sine',.035,.1);break;
    case'golden':arp([392,494,587,784],1.2,'sine',.04,.12);break;
    case'xb':arp([784,988,1175,1568],.8,'sine',.035,.09);break;
    case'launch':tone(110+a*220,.28,'triangle',.045,2.5);break;
    case'drain':tone(196,.9,'sine',.045,.5);break;
    case'save':tone(659,.6,'sine',.035,1.5);break;
  }}

/* ================= scoring & rules ================= */
function burst(x,y,n,big){for(let i=0;i<n&&parts.length<420;i++){const a=Math.random()*TAU,s=30+Math.random()*(big?300:140);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:.35+Math.random()*.7,sz:.7+Math.random()*1.6});}}
function pop(x,y,text,col,size,life){pops.push({x:clamp(x,40,360),y,text,col,size:size||12,l:0,m:life||1.1});if(pops.length>36)pops.shift();}
function award(p,x,y,big,col){const v=Math.round(p*G.mult*(G.golden>0?2:1)/10)*10;G.score+=v;G.gain+=v;G.gainT=2.2;
  if(x!=null)burst(x,y,big?26:5,big);
  if(col&&x!=null)pop(x,y-6,'+'+fmt(v),col,big?17:v>=5000?14:12,big?1.5:1.1);
  if(G.score>=G.nextXB){G.nextXB+=2500000;giveXB();pop(186,700,'Extra ball',COL.gold,17,1.8);}}
function giveXB(){G.spare++;G.trayPulse=1.6;G.flash=Math.max(G.flash,.7);sfx('xb');}
const rot=(l,d)=>d<0?[...l.slice(1),l[0]]:[l[l.length-1],...l.slice(0,-1)];
function rotLanes(d){G.lanes=rot(G.lanes,d);G.low=rot(G.low,d);}
function rollover(i,b){
  if(G.skillT>0&&i===G.skill){G.skillT=0;award(25000,b.x,b.y+30,true,COL.gold);pop(b.x,b.y+56,'Skill shot',COL.gold,15,1.6);sfx('jackpot');}
  if(!G.lanes[i]){G.lanes[i]=1;award(2500,b.x,b.y+10,false,COL.lane);sfx('lane',i);}else award(500);
  if(G.lanes.every(v=>v)){G.lanes=[0,0,0];G.laneFlash=1.3;G.mult=Math.min(6,G.mult+1);G.energy=Math.min(1,G.energy+.45);
    award(25000,200,100,true,COL.lane);pop(200,130,G.mult+'× scoring',COL.lane,15,1.6);sfx('chord');}}
function lowRoll(i,b){
  if(!G.low[i]){G.low[i]=1;award(2000,b.x,b.y,false,COL.lane);sfx('lane',i);}else award(300);
  if(G.low.every(v=>v)){G.low=[0,0,0,0];G.lowFlash=1.3;G.save=Math.max(G.save,10);award(20000,186,640,true,COL.lane);pop(186,612,'Ankh blessing',COL.lane,15,1.6);sfx('chord');}}
function starRoll(i){const s=CONST[i],was=G.starT[i]>0;G.starT[i]=25;
  G.chain=G.chainT>0?G.chain+1:1;G.chainT=1.8;
  award((was?750:2500)+1000*(G.chain-1),s.x,s.y,false,COL.star);
  if(G.chain>1)pop(s.x,s.y-24,'×'+G.chain,COL.star,15+Math.min(G.chain,8)*2,1.3);sfx('roll',G.chain);
  if(G.starT.every(t=>t>0)){G.starT.fill(0);G.starFlash=1.6;if(!G.kbR){G.kbR=true;pop(339,640,'Kickback ready',COL.star,13,1.8);}award(40000,186,470,true,COL.star);pop(186,440,'Constellation',COL.star,17,1.8);sfx('chord');}}
function openGate(){G.gateOpen=true;G.gateT=30;gate.on=false;award(15000,110,330,true,COL.drop);pop(110,300,'Sanctum open',COL.L,14,1.6);G.flash=Math.max(G.flash,.5);sfx('gate');}
function closeGate(){G.gateOpen=false;G.gateT=0;gate.on=true;for(const d of drops)d.on=true;}
function startGolden(){G.golden=25;G.goldenLit=false;G.sand=0;award(50000,190,286,true,COL.gold);pop(190,250,'Golden hour',COL.gold,17,1.8);G.flash=1;sfx('golden');}
function startMulti(){G.multi=true;G.jackpot=true;G.jackAt='O';G.save=Math.max(G.save,12);G.gateOpen=true;gate.on=false;G.ejectQ=2;G.ejectT=1.4;pop(186,420,'Multiball',COL.L,20,2);sfx('multi');}
function shot(s,x,y,b){
  // combos only build from shots the player actually made with a flipper
  const aimed=!b||b.flipped;if(b)b.flipped=false;
  if(!aimed){if(G.comboT<=0){G.combo=0;}return;}
  if(G.comboT>0)G.combo++;else{G.combo=1;G.fresh=FRESH();}
  const f=G.fresh[s];
  if(G.combo>1){pop(x,y-26,'×'+G.combo,COL[s],20+Math.min(G.combo,8)*2.5,1.5);award(20000*Math.min(G.combo-1,9)*f,x,y+8,true,COL[s]);sfx('combo',G.combo);}
  for(const k in G.fresh)G.fresh[k]=k===s?f*.5:Math.min(1,G.fresh[k]+.3);
  G.comboT=5.5;
  if(G.combo>=5&&!G.xbLit&&!G.xbThisBall){G.xbLit=true;pop(338,410,'Extra ball lit',COL.O,14,1.8);sfx('lit');}}
function jackpotAt(k,x,y,col){if(G.jackpot&&G.jackAt===k){G.jackAt=k==='O'?'C':'O';award(150000,x,y,true,col);pop(x,y-30,'Jackpot',col,18,1.6);G.flash=1;sfx('jackpot');}}
function sanctum(){G.eyeGlow=1.6;G.flash=Math.max(G.flash,.8);
  if(G.multi){award(400000,96,218,true,COL.L);pop(110,170,'Super jackpot',COL.L,18,1.8);sfx('jackpot');return;}
  G.relics++;award(50000+25000*G.relics,100,218,true,COL.L);pop(110,180,'Relic '+G.relics+' of 3',COL.L,13,1.6);sfx('relic');
  if(G.relics>=3){G.relics=0;startMulti();}else closeGate();}
function orbitDone(x,y,b){G.orbitLit=Math.min(10,G.orbitLit+2);G.orbitFlash=1;
  shot('O',x,y,b);award(7500+2500*G.orbitLit,x,y,false,COL.O);G.energy=Math.min(1,G.energy+.15);sfx('orbit');

  for(let k=0;k<3;k++){const p=at(LRAMP,24+k*22),q=at(LRAMP,30+k*22),a=Math.atan2(q.y-p.y,q.x-p.x);
    const on=G.gateOpen?(.35+.65*Math.max(0,Math.sin(t*6-k*1.2))):0;
    g.save();g.translate(p.x,p.y);g.rotate(a);g.strokeStyle=on?`rgba(185,130,40,${.4+on*.6})`:'rgba(120,88,48,.3)';g.lineWidth=2;g.lineCap='round';
    g.beginPath();g.moveTo(-3,-6);g.lineTo(3,0);g.lineTo(-3,6);g.stroke();g.restore();if(on)glow(g,p.x,p.y,11,GOLD,on*.45);}
  const n=G.spare;for(let i=0;i<n&&i<10;i++){const x=i<5?136-i*21:212+(i-5)*21+12,y=772.5;
    g.fillStyle='rgba(40,25,10,.3)';g.beginPath();g.arc(x+1,y+1.5,7,0,TAU);g.fill();drawBall(g,x,y,7);}
  if(G.trayPulse>0)glow(g,94,772,60,GOLD,G.trayPulse*.35);
  if(G.save>0||G.saveFlash>0){const blink=G.save>0&&G.save<3?(Math.sin(t*14)>0?1:.3):1;
    glow(g,186,771,22,GOLD,(.4*blink)*(G.save>0?1:0)+G.saveFlash*.6);g.strokeStyle='#b98a2e';g.lineWidth=1.5;gAnkh(g,186,771,8);}
  for(const b of balls){if(b.st==='play'||b.hide)continue;const z=b.z,rad=R*(1+.32*z);
    g.fillStyle=`rgba(35,22,10,${.22+.1*z})`;g.beginPath();g.ellipse(b.x+z*6+1.5,b.y+z*8+2,rad*.95,rad*.8,0,0,TAU);g.fill();
    drawBall(g,b.x,b.y,rad);}
  g.globalCompositeOperation='lighter';
  for(const p of parts){const a=1-p.l/p.m;g.fillStyle=`rgba(255,${200+30*a|0},${120+60*a|0},${a*.85})`;g.beginPath();g.arc(p.x,p.y,p.sz*(.5+a*.6),0,TAU);g.fill();}
  g.globalCompositeOperation='source-over';
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  for(const q of pops){const k=q.l/q.m,a=k<.6?1:1-(k-.6)/.4,sc=1+.4*Math.max(0,1-q.l*7);
    g.globalAlpha=a;g.font=`700 ${(q.size*sc).toFixed(1)}px "Cormorant Garamond", Georgia, serif`;
    const y=q.y-q.l*26;g.strokeStyle='rgba(250,245,232,.9)';g.lineWidth=3.2;g.strokeText(q.text,q.x,y);g.fillStyle=q.col;g.fillText(q.text,q.x,y);}
  g.globalAlpha=1;
  if(G.flash>0){g.save();fieldPath(g);g.clip();g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,215,140,${G.flash*.14})`;g.fillRect(0,0,400,800);g.restore();}
  if(G.over){g.save();fieldPath(g);g.clip();g.fillStyle='rgba(22,15,8,.32)';g.fillRect(0,0,400,800);g.restore();}}
function drawBall(g,x,y,rad){const q=g.createRadialGradient(x-rad*.35,y-rad*.4,rad*.08,x,y,rad);
  q.addColorStop(0,'#ffffff');q.addColorStop(.25,'#ebe7de');q.addColorStop(.7,'#958f83');q.addColorStop(1,'#48423a');
  g.fillStyle=q;g.beginPath();g.arc(x,y,rad,0,TAU);g.fill();
  g.strokeStyle='rgba(255,210,130,.45)';g.lineWidth=.9;g.beginPath();g.arc(x,y,rad*.78,.35,1.45);g.stroke();}
function drawFlipper(g,f){const ang=Math.atan2(f.ty-f.y,f.tx-f.x);g.save();g.translate(f.x,f.y);g.rotate(ang);
  const shape=()=>{g.beginPath();g.moveTo(0,-9);g.lineTo(FL,-5);g.arc(FL,0,5,-Math.PI/2,Math.PI/2);g.lineTo(0,9);g.arc(0,0,9,Math.PI/2,Math.PI*1.5);};
  g.save();g.translate(2,3);shape();g.fillStyle='rgba(40,25,10,.3)';g.fill();g.restore();
  shape();const q=g.createLinearGradient(0,-9,0,9);q.addColorStop(0,'#fdf9ef');q.addColorStop(.6,'#e6dcc4');q.addColorStop(1,'#c6b793');g.fillStyle=q;g.fill();
  g.strokeStyle=goldG(g,0,-9,FL,9);g.lineWidth=1.6;g.stroke();
  g.strokeStyle='rgba(176,138,60,.8)';g.lineWidth=.8;g.beginPath();g.moveTo(10,0);g.lineTo(FL-4,0);g.stroke();
  g.fillStyle=goldG(g,-4,-4,4,4);g.beginPath();g.arc(0,0,4.2,0,TAU);g.fill();g.fillStyle='#27497d';g.beginPath();g.arc(0,0,1.7,0,TAU);g.fill();
  g.restore();}
function astro(g,t){const cx=ACX,cy=470;
  if(G.golden>0){g.save();g.translate(cx,cy);g.rotate(t*.25);g.globalCompositeOperation='lighter';
    for(let i=0;i<16;i++){g.rotate(TAU/16);g.fillStyle=`rgba(255,185,90,${.05+.03*Math.sin(t*4+i)})`;g.beginPath();g.moveTo(0,-52);g.lineTo(-7,-130);g.lineTo(7,-130);g.closePath();g.fill();}
    g.restore();glow(g,cx,cy,74,WARM,.28);}
  for(let i=0;i<5;i++){if(i>=G.mult-1)continue;const a=-Math.PI/2+(i-2)*.34,x=cx+Math.cos(a)*48,y=cy+Math.sin(a)*48;
    g.fillStyle='#e8c56c';g.beginPath();g.arc(x,y,3.4,0,TAU);g.fill();glow(g,x,y,10,GOLD,.55);}
  for(let i=0;i<3;i++){if(!(i<G.relics||G.multi))continue;const a=Math.PI/2+(i-1)*.42,x=cx+Math.cos(a)*48,y=cy+Math.sin(a)*48;
    const q=g.createLinearGradient(x-4,y-5,x+4,y+5);q.addColorStop(0,'#6d9ae0');q.addColorStop(1,'#1c3a6e');g.fillStyle=q;
    g.beginPath();g.moveTo(x,y-5);g.lineTo(x+4,y);g.lineTo(x,y+5);g.lineTo(x-4,y);g.closePath();g.fill();glow(g,x,y,12,LAPIS,.5);}
  // hourglass sand
  const s=G.sand,sc=G.goldenLit?`rgb(${240},${190+30*Math.sin(t*6)|0},90)`:'#cf9f45';g.fillStyle=sc;
  const hh=20*Math.sqrt(Math.max(0,1-s));if(hh>.3){g.beginPath();g.moveTo(cx,cy-2);g.lineTo(cx-12*hh/20,cy-2-hh);g.lineTo(cx+12*hh/20,cy-2-hh);g.closePath();g.fill();}
  const bh=20*(1-Math.sqrt(Math.max(0,1-s)));if(bh>.3){const w=12*(20-bh)/20;g.beginPath();g.moveTo(cx-12,cy+22);g.lineTo(cx+12,cy+22);g.lineTo(cx+w,cy+22-bh);g.lineTo(cx-w,cy+22-bh);g.closePath();g.fill();}
  if(G.sandFlow>0&&s<1){g.strokeStyle=sc;g.lineWidth=.8;g.beginPath();g.moveTo(cx,cy-2);g.lineTo(cx,cy+22-bh);g.stroke();}
  if(G.goldenLit)glow(g,cx,cy,34,WARM,.35+.25*Math.sin(t*6));
  // combo timer ring
  if(G.comboT>0&&G.combo>0){const fr=G.comboT/5.5;g.strokeStyle=`rgba(212,160,60,${.55+.07*Math.min(G.combo,6)})`;g.lineWidth=2.4;g.lineCap='round';
    g.beginPath();g.arc(cx,cy,58,-Math.PI/2,-Math.PI/2+fr*TAU);g.stroke();
    glow(g,cx,cy-58,14,GOLD,.3*fr);}}
function drawHeader(){const g=ctx;g.textAlign='center';g.textBaseline='alphabetic';
  g.font='600 34px "Cormorant Garamond", "Iowan Old Style", Georgia, serif';
  const q=g.createLinearGradient(0,-60,0,-26);q.addColorStop(0,'#f5e6bb');q.addColorStop(1,'#c9a55a');g.fillStyle=q;
  g.fillText(fmt(G.shown),200,-30);
  if(G.gain>0){g.globalAlpha=Math.min(1,G.gainT*1.6);g.font='500 16px "Cormorant Garamond", Georgia, serif';g.fillStyle='#a88c55';
    g.fillText('+'+fmt(G.gain),200,-9);g.globalAlpha=1;}}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgC,0,0);
  base(ctx);ctx.save();fieldPath(ctx);ctx.clip();drawField(T);ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(topC,0,0);
  base(ctx);drawTop(T);drawHeader();}

/* ================= layout & loop ================= */
function layout(){const r=cv.getBoundingClientRect();rect=r;cw=Math.max(1,r.width);ch=Math.max(1,r.height);
  dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  S=Math.min(cw/W,ch/H);ox=(cw-W*S)/2;oy=(ch-H*S)/2;renderStatic();}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
document.addEventListener('fullscreenchange',layout);document.addEventListener('webkitfullscreenchange',layout);
newGame();layout();
if(document.fonts&&document.fonts.load)document.fonts.load('600 34px "Cormorant Garamond"').catch(()=>{});
let last=performance.now();
function frame(now){const dt=Math.min(1/30,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__pb={G,balls,update,draw,ptrs,press,tryLaunch,gate};
})();
