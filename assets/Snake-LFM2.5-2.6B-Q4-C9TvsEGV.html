<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 100, 0.5);
        }

        #score-board {
            position: relative;
            z-index: 10;
        }

        #score {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #00ff88;
        }

        #high-score {
            font-size: 1rem;
            color: #ffaa00;
            margin-top: 0.5rem;
        }

        #game-container {
            position: relative;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.3);
        }

        canvas {
            display: block;
            background: #1a1a1a;
        }

        #restart-btn {
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #restart-btn:hover {
            background: #ff6666;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #game-over-screen h2 {
            font-size: 2rem;
            color: #ff4444;
            margin-bottom: 1rem;
        }

        #final-score {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #00ff88;
        }

        .instructions {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <div id="score-board">
        <div id="score">Score: 0</div>
        <div id="high-score">Best: 0</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button id="restart-btn">Restart</button>
    </div>

    <div id="game-over-screen">
        <h2>Game Over!</h2>
        <div id="final-score">Final Score: 0</div>
        <button id="restart-btn">Play Again</button>
    </div>

    <div class="instructions">
        Use W/A/S/D to move • R or Ctrl+R to restart • Game over when you hit a wall or yourself
    </div>

    <script>
        // Game configuration
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 400;
        const SNAKE_TILE_SIZE = 20;
        const INITIAL_SNAKE_LENGTH = 3;
        const INITIAL_SPEED = 150; // ms per move

        // Game state
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = { x: 1, y: 0 }; // Start moving right
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = 0;
        let gameRunning = false;
        let gameInterval = null;
        let moveCount = 0;

        // DOM elements
        const canvas = document.getElementById('gameCanvas');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        // Initialize game
        function initGame() {
            // Create initial snake
            snake = [
                { x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2 },
                { x: CANVAS_WIDTH / 2 - 20, y: CANVAS_HEIGHT / 2 },
                { x: CANVAS_WIDTH / 2 - 40, y: CANVAS_HEIGHT / 2 }
            ];
            
            // Place initial food
            placeFood();
            
            // Reset state
            score = 0;
            moveCount = 0;
            scoreEl.textContent = `Score: ${score}`;
            highScoreEl.textContent = `Best: ${highScore}`;
            gameRunning = true;
            gameInterval = setInterval(moveSnake, INITIAL_SPEED);
        }

        // Place food at random unoccupied cell
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * CANVAS_WIDTH);
                food.y = Math.floor(Math.random() * CANVAS_HEIGHT);
                validPosition = true;
                // Check if food collides with snake
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        // Move the snake
        function moveSnake() {
            if (!gameRunning) return;

            // Update direction (prevent 180-degree turns)
            if (nextDirection.x !== null && nextDirection.x === -direction.x) {
                nextDirection.x = null;
            }
            if (nextDirection.y !== null && nextDirection.y === -direction.y) {
                nextDirection.y = null;
            }

            // Apply new direction
            direction.x = nextDirection.x;
            direction.y = nextDirection.y;

            // Calculate new head position
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            // Check wall collision
            if (head.x < 0 || head.x >= CANVAS_WIDTH || head.y < 0 || head.y >= CANVAS_HEIGHT) {
                gameOver();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Add new head
            snake.unshift(head);

            // Check if food eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = `Score: ${score}`;
                moveCount++;

                // Update high score
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = `Best: ${highScore}`;
                }

                placeFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            // Increase speed slightly as score increases
            if (score % 50 === 0 && INITIAL_SPEED > 50) {
                INITIAL_SPEED -= 10;
            }
        }

        // Game over handler
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            finalScoreEl.textContent = `Final Score: ${score}`;
            gameOverScreen.style.display = 'flex';
            restartBtn.focus();
        }

        // Restart button handler
        function restartGame() {
            initGame();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
            }

            switch (e.key) {
                case 'w':
                case 'W':
                    handleDirectionChange(0, -1);
                    break;
                case 'a':
                case 'A':
                    handleDirectionChange(-1, 0);
                    break;
                case 's':
                case 'S':
                    handleDirectionChange(0, 1);
                    break;
                case 'd':
                case 'D':
                    handleDirectionChange(1, 0);
                    break;
            }
        });

        function handleDirectionChange(dx, dy) {
            // Prevent 180-degree turns
            if (direction.x !== 0 && dx === -direction.x) return;
            if (direction.y !== 0 && dy === -direction.y) return;

            nextDirection = { x: dx, y: dy };
        }

        // Start the game when the page loads
        document.addEventListener('DOMContentLoaded', initGame);

        // Restart button event
        restartBtn.addEventListener('click', restartGame);
    </script>
</body>
</html>
